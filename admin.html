<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administration — JobMarket &amp; Shalom Square</title>
<style>
:root{--bg:#0e1015;--card:#161a22;--line:#252b36;--ink:#e8ecf3;--muted:#8b95a5;
  --gold:#ffd700;--ok:#16a34a;--ko:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:20px;margin:6px 0 4px}
.sous{color:var(--muted);font-size:13px;margin-bottom:18px}
.bloc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.bloc h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.count{font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--muted)}
.count.rouge{background:rgba(239,68,68,.18);color:#fca5a5}
.count.vert{background:rgba(22,163,74,.18);color:#86efac}
.item{border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px}
.src{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.4px;padding:2px 8px;border-radius:999px;margin-right:7px}
.src.jobmarket{background:#1d4ed8;color:#dbeafe}
.src.shalom{background:#0e9f6e;color:#d1fae5}
.src.deduit{background:#52525b;color:#e4e4e7}
.qui{font-weight:700}
.quand{color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{border:none;border-radius:10px;padding:9px 14px;font-weight:800;font-size:13.5px;cursor:pointer;min-height:40px}
.b-ok{background:linear-gradient(135deg,var(--ok),#15803d);color:#03150e}
.b-ko{background:rgba(239,68,68,.16);color:#fca5a5;border:1px solid rgba(239,68,68,.4)}
.dim{color:var(--muted);font-size:13px}
.vide{color:var(--muted);font-size:13.5px;text-align:center;padding:14px 0}
button.b-google{width:100%;background:#fff;color:#111;font-size:15px;padding:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Administration</h1>
  <div class="sous">JobMarket Cameroon · Shalom Square — un seul endroit, origine toujours indiquée.</div>

  <div class="bloc" id="blocLogin">
    <h2>Connexion</h2>
    <div class="dim" style="margin-bottom:11px">Connectez-vous avec le compte administrateur.</div>
    <button class="b-google" id="btnGoogle">🔵 Continuer avec Google</button>
    <div id="msgLogin" class="dim" style="margin-top:10px"></div>
  </div>

  <div id="app" style="display:none">
    <div class="bloc" id="blocPrive"></div>
    <div class="bloc" id="blocVerif"></div>
    <div class="bloc" id="blocSignal"></div>
    <div class="bloc" id="blocErr"></div>
  </div>
</div>

<!-- =====================================================================
     SDK Firebase 13 MODULAIRE (au lieu du 9.23 « compat »).
     Pourquoi :
       - le mode compat est une solution temporaire que Firebase supprimera.
         Ce jour-la, l'application cesse de fonctionner.
       - le mode modulaire laisse le navigateur ne charger que les fonctions
         reellement utilisees (tree-shaking). Mesure Firebase sur un projet
         comparable : 429 Ko en compat, 244 Ko en modulaire.
     On charge depuis la CDN officielle : plus de fichiers locaux a maintenir,
     et les correctifs de securite arrivent sans rien faire.
     ===================================================================== -->
<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
         getRedirectResult, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import { getDatabase, ref, get, update, remove }
  from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

const $ = (i) => document.getElementById(i);

const app = initializeApp({
  apiKey: "AIzaSyCR1Z6VlS5A7iPbUCoVm0AQcnkkUdsA0CE",
  authDomain: "jobmarketfuture.firebaseapp.com",
  databaseURL: "https://jobmarketfuture-default-rtdb.firebaseio.com",
  projectId: "jobmarketfuture",
  storageBucket: "jobmarketfuture.firebasestorage.app",
  messagingSenderId: "351669024349",
  appId: "1:351669024349:web:d4d4d08727ccc6012b7fb4"
});
const auth = getAuth(app);
const db = getDatabase(app);

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function quand(t) {
  try {
    const n = Number(t);
    if (!n) return "date inconnue";
    const d = new Date(n);
    return isNaN(d.getTime()) ? "date inconnue" :
      d.toLocaleDateString("fr-FR") + " " +
      d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  } catch (e) { return "date inconnue"; }
}

const VENDEURS_SHALOM = {};

/* L'origine est lue dans la donnee. Si elle manque (ancienne demande), on la
   deduit : un vendeur qui possede des annonces boutique vient de Shalom.
   Sinon on l'avoue — jamais une supposition presentee comme une certitude. */
function sourceDe(v, uid) {
  const s = (v && (v.source || v.app)) ? String(v.source || v.app).toLowerCase() : "";
  if (s.includes("shalom") || s.includes("boutique") || s.includes("market"))
    return { cle: "shalom", txt: "SHALOM", deduit: false };
  if (s.includes("job")) return { cle: "jobmarket", txt: "JOBMARKET", deduit: false };
  if (VENDEURS_SHALOM[uid]) return { cle: "shalom", txt: "SHALOM ?", deduit: true };
  return { cle: "jobmarket", txt: "JOBMARKET ?", deduit: true };
}
function codeA7() {
  let c = "";
  for (let i = 0; i < 7; i++) c += Math.floor(Math.random() * 10);
  return c;
}

/* ---------- connexion ---------- */
$("btnGoogle").onclick = () => {
  const prov = new GoogleAuthProvider();
  prov.setCustomParameters({ prompt: "select_account" });
  const mobile = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
  (mobile ? signInWithRedirect(auth, prov) : signInWithPopup(auth, prov))
    .catch((e) => { $("msgLogin").textContent = e.message; });
};

getRedirectResult(auth).catch((e) => { $("msgLogin").textContent = e.message; });

onAuthStateChanged(auth, (u) => {
  if (!u) return;
  $("msgLogin").textContent = "Connecté. Vérification des droits…";
  /* Le catch est indispensable : sans lui, un refus de lecture echoue en
     silence et la page reste bloquee sur l'ecran de connexion sans rien
     dire. C'est exactement la panne remontee par Ghislain. */
  get(ref(db, "admins/" + u.uid)).then((s) => {
    if (s.val() !== true) {
      $("msgLogin").innerHTML = "Connecté en tant que <b>" + esc(u.email || u.uid) +
        "</b>, mais ce compte n'est pas dans la liste <code>admins</code>.";
      return;
    }
    $("blocLogin").style.display = "none";
    $("app").style.display = "";
    tout();
  }).catch((e) => {
    $("msgLogin").innerHTML = "Lecture impossible : <b>" + esc(e.message) +
      "</b><br>Causes les plus fréquentes : les règles ETAPE6 ne sont pas " +
      "publiées, ou ce compte n'a pas le droit de lire <code>admins</code>.";
  });
});

/* ---------- lecture ---------- */
function tout() {
  Promise.all([
    get(ref(db, "verifications")),
    get(ref(db, "market_reports")),
    get(ref(db, "reports")),
    get(ref(db, "errorLogs")),
    get(ref(db, "market_listings")),
    get(ref(db, "jobs")),
    get(ref(db, "profiles"))
  ]).then((r) => {
    const ml = r[4].val() || {};
    Object.keys(ml).forEach((k) => { if (ml[k] && ml[k].user) VENDEURS_SHALOM[ml[k].user] = true; });
    prive(r[5].val() || {}, r[6].val() || {}, ml);
    verif(r[0].val() || {});
    signal(r[1].val() || {}, r[2].val() || {});
    erreurs(r[3].val() || {});
  }).catch((e) => {
    $("app").innerHTML = '<div class="bloc"><h2>Lecture impossible</h2>' +
      '<div style="color:var(--muted);font-size:13.5px;line-height:1.6"><b>' + esc(e.message) +
      '</b><br><br>Cause la plus fréquente : les règles <b>ETAPE6</b> ne sont pas publiées. ' +
      'Sans elles, ce tableau ne peut lire ni les vérifications ni les administrateurs.</div></div>';
  });
}

function compteN(noeud, champs) {
  let n = 0;
  Object.keys(noeud).forEach((k) => {
    const o = noeud[k];
    if (!o || typeof o !== "object") return;
    if (champs.some((c) => o[c])) n++;
  });
  return n;
}

function prive(jobs, profiles, ml) {
  const a = compteN(jobs, ["phone", "phone2"]);
  const b = compteN(profiles, ["phone", "whatsappNumber"]);
  const c = compteN(ml, ["phone"]);
  const t = a + b + c;
  $("blocPrive").innerHTML =
    '<h2>Mise à l’abri <span class="count ' + (t ? "rouge" : "vert") + '">' + t + '</span></h2>' +
    '<div class="dim">Numéros lisibles par n’importe qui sans compte :</div>' +
    '<div style="margin-top:8px;font-size:13.5px">' +
    "Annonces JobMarket <b>" + a + " / " + Object.keys(jobs).length + "</b><br>" +
    "Profils <b>" + b + " / " + Object.keys(profiles).length + "</b><br>" +
    "Annonces boutique <b>" + c + " / " + Object.keys(ml).length + "</b></div>" +
    (t ? '<div class="dim" style="margin-top:10px">Ouvrez « outil-vie-privee.html » puis « Tout mettre à l’abri ».</div>'
       : '<div class="dim" style="margin-top:10px">Rien en clair : l’ETAPE7 peut être publiée.</div>');
}

function verif(d) {
  const enAttente = [];
  let traitees = 0;
  Object.keys(d).forEach((uid) => {
    const v = d[uid] || {};
    const st = String(v.status || "").toLowerCase();
    if (["approved", "refused", "rejected"].includes(st)) { traitees++; return; }
    if (st === "" && !v.requestedAt) return;
    enAttente.push({ uid, v });
  });
  enAttente.sort((x, y) => Number(y.v.requestedAt || 0) - Number(x.v.requestedAt || 0));

  let html = '<h2>Vérifications <span class="count ' + (enAttente.length ? "rouge" : "vert") + '">' +
    enAttente.length + " en attente</span> <span class=\"count\">" + traitees + " traitée(s)</span></h2>";
  if (!enAttente.length) html += '<div class="vide">Aucune demande en attente.</div>';
  enAttente.forEach((x) => {
    const s = sourceDe(x.v, x.uid);
    const nom = x.v.name || x.v.userName || x.uid.slice(0, 10);
    const type = (x.v.type === "company" || (x.v.company && x.v.company.requestedAt)) ?
      "entreprise" : "particulier";
    html += '<div class="item">' +
      '<span class="src ' + s.cle + '">' + s.txt + "</span>" +
      '<span class="qui">' + esc(nom) + "</span> " +
      '<span class="quand">· ' + quand(x.v.requestedAt) + " · " + esc(type) +
      (s.deduit ? " · origine déduite" : "") + "</span>" +
      '<div class="actions">' +
      '<button class="b-ok" data-acc="' + esc(x.uid) + '">✓ Accepter</button>' +
      '<button class="b-ko" data-ref="' + esc(x.uid) + '">✕ Refuser</button>' +
      "</div></div>";
  });
  $("blocVerif").innerHTML = html;
  $("blocVerif").querySelectorAll("[data-acc]").forEach((b) =>
    b.onclick = () => accepter(b.getAttribute("data-acc")));
  $("blocVerif").querySelectorAll("[data-ref]").forEach((b) =>
    b.onclick = () => refuser(b.getAttribute("data-ref")));
}

function accepter(uid) {
  if (!confirm("Accepter cette vérification ?")) return;
  const code = codeA7();
  const maj = {
    status: "approved", verifiedAt: Date.now(), verified: true,
    verificationCode: code, codeAt: Date.now()
  };
  update(ref(db, "verifications/" + uid), maj)
    .then(() => update(ref(db, "profiles/" + uid), { verified: true, verifiedAt: Date.now() }))
    .then(() => {
      alert("Vérifié. Code à 7 chiffres : " + code +
        "\n\nDonnez ce code à la personne : elle le saisit dans son application.");
      tout();
    })
    .catch((e) => alert("Échec : " + e.message));
}

function refuser(uid) {
  if (!confirm("Refuser cette vérification ? La demande sera effacée.")) return;
  remove(ref(db, "verifications/" + uid)).then(() => tout()).catch((e) => alert("Échec : " + e.message));
}

function signal(market, job) {
  const l = [];
  Object.keys(market).forEach((k) => {
    const g = market[k] || {};
    Object.keys(g).forEach((j) => l.push({ src: "shalom", o: g[j], id: j }));
  });
  Object.keys(job).forEach((k) => {
    const o = job[k];
    if (o && typeof o === "object") l.push({ src: "jobmarket", o, id: k });
  });
  l.sort((a, b) => Number(b.o.timestamp || 0) - Number(a.o.timestamp || 0));
  let html = '<h2>Signalements <span class="count ' + (l.length ? "rouge" : "vert") + '">' + l.length + "</span></h2>";
  if (!l.length) html += '<div class="vide">Aucun signalement.</div>';
  l.slice(0, 40).forEach((x) => {
    const txt = x.src === "shalom" ? "SHALOM" : "JOBMARKET";
    html += '<div class="item"><span class="src ' + x.src + '">' + txt + "</span> " +
      esc(x.o.motif || x.o.reason || "motif non précisé") +
      ' <span class="quand">· ' + quand(x.o.timestamp) + "</span>" +
      (x.o.listingTitle ? '<div class="dim">' + esc(x.o.listingTitle) + "</div>" : "") +
      (x.o.detail ? '<div class="dim">' + esc(String(x.o.detail).slice(0, 200)) + "</div>" : "") + "</div>";
  });
  $("blocSignal").innerHTML = html;
}

function erreurs(d) {
  const l = Object.keys(d).map((k) => d[k]).filter((o) => o && typeof o === "object");
  l.sort((a, b) => Number(b.at || 0) - Number(a.at || 0));
  let html = '<h2>Erreurs des téléphones <span class="count">' + l.length + "</span></h2>";
  if (!l.length) html += '<div class="vide">Aucune erreur enregistrée.</div>';
  l.slice(0, 30).forEach((o) => {
    html += '<div class="item"><div class="qui" style="font-size:13.5px">' +
      esc(String(o.message || "").slice(0, 220)) + "</div>" +
      '<div class="quand">' + quand(o.at) + " · " + esc(String(o.page || "")) + "</div></div>";
  });
  $("blocErr").innerHTML = html;
}
</script>
</body>
</html>
