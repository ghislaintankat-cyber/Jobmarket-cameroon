<!DOCTYPE html>
<html lang="fr" data-app-build="20261003a">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shalom Square — Messagerie sécurisée</title>
<meta name="description" content="Messagerie sécurisée Shalom Square — discutez avec les vendeurs et acheteurs d'objets et de denrées partout au Cameroun. Synchronisé avec JobMarket Cameroon.">
<meta name="theme-color" content="#0A0A0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A0A0F'/%3E%3Ctext x='32' y='42' font-size='32' text-anchor='middle'%3E%F0%9F%9B%8D%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{
  --gold:#FFD700; --gold2:#B8860B; --goldink:#0A0A0F;
  --accent:#2D6CDF; --red:#EF4444; --stars:#FFC53D; --ok:#25D366;
  --bg:#0A0A0F; --card:#151521; --card2:#1B1B2B; --line:rgba(255,255,255,.09);
  --ink:#ECECF4; --muted:#9CA0B0;
  --shadow:0 1px 3px rgba(0,0,0,.5); --shadow-lg:0 14px 38px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
/* (correctif maison) hauteur qui ne saute pas quand la barre du
   navigateur se cache : voir dvh. overflow:hidden = seules les zones
   internes defilent, jamais la page entiere. */
html{height:100dvh}
body{height:100dvh;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--ink);overflow:hidden;
  display:flex;flex-direction:column;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:inherit}
a{color:var(--gold);text-decoration:none}

/* ---------- barre du haut ---------- */
.topbar{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:var(--card);border-bottom:1px solid var(--line);
  padding-top:calc(10px + env(safe-area-inset-top));flex-shrink:0;z-index:30;
}
.logo{display:flex;align-items:center;gap:9px;min-width:0}
.logo-ic{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold2));
  display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.logo b{font-size:14.5px;letter-spacing:.2px;white-space:nowrap}
.logo .sub{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.topbar .grow{flex:1}
.tbtn{
  border:1px solid var(--line);background:var(--card2);border-radius:10px;
  padding:7px 11px;font-size:12px;font-weight:700;white-space:nowrap;
}
.tbtn:hover{border-color:rgba(255,215,0,.4)}
.tbtn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--goldink);border:none}

/* ---------- layout 2 panneaux ---------- */
.main{flex:1;display:flex;min-height:0;position:relative}
.list-pane{
  width:100%;max-width:100%;display:flex;flex-direction:column;min-height:0;
  border-right:1px solid var(--line);background:var(--bg);
}
.searchbar{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-shrink:0}
.searchbar input{
  flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
  color:var(--ink);padding:10px 13px;font-size:13.5px;outline:none;
}
.searchbar input:focus{border-color:rgba(255,215,0,.45)}
.conv-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.conv{
  display:flex;gap:11px;padding:11px 13px;cursor:pointer;align-items:center;
  border-bottom:1px solid rgba(255,255,255,.045);
}
.conv:hover{background:var(--card)}
.conv.active{background:var(--card2)}
.conv .dot-unread{position:absolute;top:8px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--ok)}
.ava{
  width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:16px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);
}
.conv-mid{flex:1;min-width:0}
.conv-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.conv-prev{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.conv-prev .you{color:var(--gold);font-weight:700}
.conv-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.conv-time{font-size:10.5px;color:var(--muted)}
.badge{
  min-width:19px;height:19px;border-radius:999px;background:var(--ok);color:#06230f;
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;
}
.empty{
  padding:40px 22px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.7;
}
.empty .big{font-size:42px;margin-bottom:10px}

/* ---------- panneau fil ---------- */
.thread-pane{
  display:none;flex-direction:column;flex:1;min-width:0;min-height:0;background:var(--bg);
}
.thread-pane.open{display:flex}
@media(min-width:880px){
  .list-pane{width:355px;max-width:355px}
  .thread-pane{display:flex}
  .thread-pane .back-btn{display:none}
  .thread-empty-hero{display:flex}
}
@media(max-width:879px){
  .thread-pane.open{position:absolute;inset:0;z-index:40;background:var(--bg)}
}
.thread-empty-hero{
  display:none;flex:1;align-items:center;justify-content:center;flex-direction:column;gap:10px;
  color:var(--muted);font-size:13.5px;text-align:center;padding:30px;
}
.thread-head{
  display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--card);
  border-bottom:1px solid var(--line);flex-shrink:0;padding-top:calc(9px + env(safe-area-inset-top));
}
.back-btn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card2);
  font-size:16px;flex-shrink:0;
}
.thread-hmid{flex:1;min-width:0}
.thread-name{font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-tag{font-size:10px;font-weight:800;letter-spacing:.4px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;display:inline-block;margin-top:2px}
.chat-tag.secure{color:var(--ok);border-color:rgba(37,211,102,.45)}
.chat-tag.demo{color:var(--gold);border-color:rgba(255,215,0,.4)}
.hbtn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card2);
  font-size:15px;flex-shrink:0;position:relative;
}
.hbtn:disabled{opacity:.45;cursor:default}
.listing-chip{
  display:flex;align-items:center;gap:8px;margin:8px 12px 0;padding:8px 11px;border-radius:12px;
  background:var(--card);border:1px solid var(--line);font-size:12px;flex-shrink:0;cursor:pointer;
}
.listing-chip .lthumb{font-size:18px}
.listing-chip .ltitle{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listing-chip .lprice{color:var(--gold);font-weight:800;white-space:nowrap}

.bubbles{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:13px;display:flex;flex-direction:column;gap:9px;background:var(--bg)}
.bubble{max-width:84%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.45;animation:pop .18s ease-out;word-wrap:break-word}
@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:scale(1);opacity:1}}
.bubble.them{align-self:flex-start;background:var(--card2);border-bottom-left-radius:4px}
.bubble.me{align-self:flex-end;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--goldink);border-bottom-right-radius:4px;font-weight:600}
.bubble.sys{align-self:center;background:transparent;color:var(--muted);font-size:11.5px;text-align:center;border:1px dashed var(--line);border-radius:10px;padding:6px 12px;max-width:92%}
.msgtime{display:block;font-size:9.5px;opacity:.75;margin-top:3px;text-align:right}
.autolabel{display:block;font-size:9px;font-weight:800;letter-spacing:.5px;opacity:.8;margin-bottom:2px}
.quotecard{background:rgba(0,0,0,.18);border-radius:8px;padding:6px 8px;margin-bottom:5px;font-size:12px}
.bubble.them .quotecard{background:rgba(255,255,255,.06)}
.dim{color:var(--muted)}
.bubble .trans{margin-top:6px;padding-top:6px;border-top:1px dashed rgba(255,255,255,.25);font-size:12.5px;opacity:.92}
.bubble .trans b{font-size:9.5px;letter-spacing:.5px;opacity:.7;display:block;margin-bottom:2px}
.bubble-acts{display:flex;gap:6px;align-self:flex-start;margin-top:-4px;padding:0 4px}
.bact{
  font-size:10.5px;font-weight:700;border:1px solid var(--line);border-radius:999px;
  background:var(--card);padding:3px 9px;color:var(--muted);
}
.bact:hover{color:var(--gold);border-color:rgba(255,215,0,.4)}

.qchips{display:flex;gap:7px;padding:8px 12px 2px;flex-wrap:wrap;flex-shrink:0}
.qchip{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--card);cursor:pointer;font-weight:700}
.qchip:hover{border-color:rgba(255,215,0,.4)}
.qchip.ai{border-color:rgba(45,108,223,.55);color:#8FB7FF;background:rgba(45,108,223,.12)}
.qchip.ai.busy{opacity:.55;pointer-events:none}

.chat-input{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);flex-shrink:0;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.chat-input input{
  flex:1;background:var(--card);border:1px solid var(--line);border-radius:999px;
  color:var(--ink);padding:11px 16px;font-size:13.5px;outline:none;
}
.chat-input input:focus{border-color:rgba(255,215,0,.45)}
.sendbtn{
  width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:var(--goldink);font-size:17px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
}
.sendbtn:disabled{opacity:.5}

/* ---------- banniere notif heads-up ---------- */
.banner{
  position:fixed;top:0;left:0;right:0;z-index:400;transform:translateY(-110%);
  transition:transform .28s cubic-bezier(.2,.9,.3,1.2);
  background:var(--card2);border-bottom:1px solid var(--line);box-shadow:var(--shadow-lg);
  display:flex;gap:11px;align-items:center;padding:11px 14px;cursor:pointer;
  padding-top:calc(11px + env(safe-area-inset-top));
}
.banner.show{transform:translateY(0)}
.banner .b-ic{font-size:22px}
.banner .b-title{font-size:12.5px;font-weight:800}
.banner .b-text{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70vw}

/* ---------- modal ---------- */
.modal-veil{
  position:fixed;inset:0;background:rgba(4,4,8,.72);z-index:300;display:flex;
  align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px);
}
.modal{
  background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:420px;width:100%;
  padding:20px;box-shadow:var(--shadow-lg);max-height:86vh;overflow-y:auto;
}
.field{margin-bottom:11px}
.field label{display:block;font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:5px;letter-spacing:.3px}
.field input{
  width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;
  color:var(--ink);padding:11px 13px;font-size:14px;outline:none;
}
.field input:focus{border-color:rgba(255,215,0,.5)}
.btn{
  border-radius:12px;padding:12px 16px;font-size:13.5px;font-weight:800;cursor:pointer;
  border:1px solid var(--line);background:var(--card2);width:100%;
}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--goldink);border:none}
.btn-ghost{background:transparent}
.formerr{color:var(--red);font-size:12px;min-height:16px;margin:4px 0 8px}
.two{display:flex;gap:10px}
.two>*{flex:1}

.toast{
  position:fixed;bottom:18px;left:50%;transform:translate(-50%,140%);z-index:500;
  background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:12px;
  padding:11px 18px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);
  transition:transform .25s ease;max-width:88vw;text-align:center;
}
.toast.show{transform:translate(-50%,0)}

.offline-bar{
  display:none;background:rgba(239,68,68,.14);border-bottom:1px solid rgba(239,68,68,.4);
  color:#FCA5A5;font-size:11.5px;font-weight:700;text-align:center;padding:6px 10px;flex-shrink:0;
}
.offline-bar.show{display:block}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--card2);border-radius:8px}

/* (correctif maison) THEME CLAIR — valeurs identiques a celles du marche,
   pour que les deux pages soient rigoureusement de la meme couleur. */
body.light{
  --bg:#F4F5F7; --card:#FFFFFF; --card2:#F0F1F4; --line:#E4E7EF;
  --ink:#14161B; --muted:#5C6270;
  --shadow:0 1px 3px rgba(20,22,30,.08); --shadow-lg:0 14px 34px rgba(20,22,30,.16);
}
/* photo recue depuis JobMarket, affichee dans la bulle */
.msgphoto{display:block;max-width:220px;width:100%;border-radius:10px;margin:4px 0;
  cursor:zoom-in;background:rgba(255,255,255,.05);}
</style>
</head>
<body>

<div class="topbar">
  <a class="logo" href="./shalom-square.html" id="backLink" title="Retour au marché">
    <div class="logo-ic">🛍️</div>
    <div style="min-width:0">
      <b>Shalom Square</b>
      <div class="sub" data-i18n="app_sub" id="appSub">MESSAGERIE SÉCURISÉE</div>
    </div>
  </a>
  <div class="grow"></div>
  <button class="tbtn" id="langBtn" onclick="toggleLang()">EN</button>
  <button class="tbtn gold" id="authBtn" onclick="authClick()">🔐 <span data-i18n="login_btn">Connexion</span></button>
</div>
<div class="offline-bar" id="offlineBar" data-i18n="offline_bar">📡 Connexion à la base sécurisée en cours…</div>

<div class="main">
  <aside class="list-pane" aria-label="Conversations">
    <div class="searchbar">
      <input id="searchInput" type="search" data-i18n-ph="search_ph" placeholder="Rechercher une conversation…" oninput="renderInbox()">
    </div>
    <div class="conv-scroll" id="convList"></div>
  </aside>

  <section class="thread-pane" id="threadPane" aria-label="Conversation">
    <div class="thread-empty-hero" id="threadHero">
      <div style="font-size:46px">💬</div>
      <b data-i18n="hero_title" style="color:var(--ink);font-size:15px">Sélectionnez une conversation</b>
      <span data-i18n="hero_p">Vos discussions avec les vendeurs et acheteurs apparaissent ici — elles sont synchronisées avec l'app JobMarket Cameroon.</span>
    </div>
    <div id="threadUI" style="display:none;flex-direction:column;flex:1;min-height:0">
      <div class="thread-head">
        <button class="back-btn" onclick="closeThreadUI()" aria-label="Retour">←</button>
        <a class="back-btn" id="toMarketBtn" href="./shalom-square.html" title="Retour au marché" aria-label="Retour au marché" style="text-decoration:none">🛍️</a>
        <div class="ava" id="thAva" style="width:38px;height:38px;font-size:14px">💬</div>
        <div class="thread-hmid">
          <div class="thread-name" id="thName">…</div>
          <span class="chat-tag secure" id="thTag" data-i18n="secure_tag">CHAT SÉCURISÉ JOBMARKET</span>
        </div>
        <button class="hbtn" id="scamBtn" onclick="aiScamCheck()" title="Vérification IA de l'annonce" style="display:none">🛡️</button>
        <button class="hbtn" id="inAppBtn" onclick="openInApp()" title="Ouvrir dans l'app JobMarket" style="display:none">📲</button>
      </div>
      <div class="listing-chip" id="listingChip" style="display:none" onclick="openListing()">
        <span class="lthumb" id="lcThumb">📦</span>
        <span class="ltitle" id="lcTitle"></span>
        <span class="lprice" id="lcPrice"></span>
      </div>
      <div class="bubbles" id="bubbles"></div>
      <div class="qchips" id="aiRow"></div>
      <div class="qchips" id="quickChips"></div>
      <div class="chat-input">
        <input id="chatInput" type="text" data-i18n-ph="chat_ph" placeholder="Écrivez un message…"
          onkeydown="if(event.key==='Enter'){event.preventDefault();sendText();}">
        <button class="sendbtn" onclick="sendText()" aria-label="Envoyer">➤</button>
      </div>
    </div>
  </section>
</div>

<div class="banner" id="banner" onclick="bannerClick()">
  <div class="b-ic" id="bIc">💬</div>
  <div style="min-width:0">
    <div class="b-title" id="bTitle"></div>
    <div class="b-text" id="bText"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toastEl" role="status"></div>

<script src="vendor/firebase-app-compat.js" onerror="__fbcdn('app')"></script>
<script src="vendor/firebase-auth-compat.js" onerror="__fbcdn('auth')"></script>
<script src="vendor/firebase-database-compat.js" onerror="__fbcdn('database')"></script>

<script>
"use strict";
/* =====================================================================
   SHALOM SQUARE — MESSAGERIE SÉCURISÉE (page dédiée)
   ---------------------------------------------------------------------
   Plateforme de messagerie du marché Shalom Square (biens & denrées),
   copiée du modèle JobMarket Cameroon (chat-widget) en respectant la
   différence de mission. Protocole chat 100 % compatible :
   - mêmes fils     : chats/{uidA}_{uidB}__market{listingKey}
   - mêmes index    : userThreads/{uid}, userInboxes/{uid}/threads
   - mêmes messages : {from,to,timestamp,readBy,text,quote,autoReply}
   → une conversation ouverte dans l'app JobMarket, sur le marché
     Shalom Square ou ici reste UNE SEULE ET MÊME conversation.
   IA (mêmes modes que JobMarket, via le worker sécurisé) :
   - suggest_reply         : réponses suggérées au vendeur/acheteur
   - translate_message     : traduction d'un message reçu
   - check_scam_signals    : vérification IA de l'annonce discutée
   - craft_contact_message : premier message rédigé par l'IA
   - ai_away_reply         : réponse automatique d'absence (vendeur)
   ===================================================================== */

/* ---------- stockage local (même shim que le marché) ---------- */
var store = (function(){
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return localStorage; }
  catch(e){ var m={}; return { getItem:function(k){return (k in m)?m[k]:null;}, setItem:function(k,v){m[k]=String(v);}, removeItem:function(k){delete m[k];} }; }
})();

/* ---------- i18n (clé partagée appLang avec le marché + JobMarket) ---------- */
var I18N={
fr:{
  app_sub:"Messagerie sécurisée", search_ph:"Rechercher une conversation…",
  login_btn:"Connexion", logout_btn:"Se déconnecter",
  secure_tag:"CHAT SÉCURISÉ JOBMARKET",
  hero_title:"Sélectionnez une conversation",
  hero_p:"Vos discussions avec les vendeurs et acheteurs apparaissent ici — elles sont synchronisées avec l'app JobMarket Cameroon.",
  inbox_empty_title:"Aucune conversation pour l'instant",
  inbox_empty_p:"Contactez un vendeur depuis le marché Shalom Square — la discussion s'ouvrira ici, en sécurité.",
  inbox_empty_go:"🛍️ Aller au marché",
  login_needed_title:"Connexion requise",
  login_needed_p:"La messagerie sécurisée nécessite un compte (comme dans l'app JobMarket). Vos conversations restent privées et chiffrées en transit.",
  sign_in_h:"Se connecter", sign_in_p:"Même compte que le marché Shalom Square et l'app JobMarket.",
  email:"Adresse e-mail", password:"Mot de passe", your_name:"Votre nom",
  login_go:"Se connecter", signup_go:"Créer un compte", no_account:"Pas de compte ?", have_account:"Déjà un compte ?",
  forgot:"Mot de passe oublié ?", reset_sent:"E-mail de réinitialisation envoyé ✓",
  signout_done:"Déconnecté. À bientôt 👋",
  chat_ph:"Écrivez un message…",
  you:"Vous", welcome_thread:"Début de votre conversation sécurisée. Écrivez votre premier message 👇",
  msg_fail:"Message non envoyé — réseau ou règles de la base.",
  q_available:"C'est toujours disponible ?", q_price:"Quel est votre dernier prix ?", q_ship:"Livrez-vous à Yaoundé ?",
  ai_suggest:"✨ Suggérer une réponse", ai_suggest_loading:"L'IA réfléchit…",
  ai_craft:"✨ Rédiger mon premier message", ai_craft_loading:"Rédaction en cours…",
  ai_translate:"Traduire", ai_translating:"Traduction…", ai_translate_fail:"Traduction indisponible — réessayez.",
  ai_scam:"Vérifier l'annonce", ai_scam_loading:"Vérification IA…",
  ai_scam_low:"✅ Annonce cohérente — aucun signal d'arnaque détecté.",
  ai_scam_medium:"⚠️ Signaux à surveiller :", ai_scam_high:"🚨 Signaux d'arnaque détectés :",
  ai_err:"IA momentanément indisponible — réessayez.",
  ai_auto_sent:"Réponse automatique envoyée (absence)",
  notif_new_msg:"Nouveau message",

function fmtXAF(n){

  try{ return new Date(ts||Date.now()).toLocaleTimeString(LANG==="fr"?"fr-FR":"en-US",{hour:"2-digit",minute:"2-digit"}); }

}
function dayLabel(ts){
  var d=new Date(ts||Date.now()), now=new Date();
  var same=(d.toDateString()===now.toDateString());
  if(same) return hhmm(ts);
  var y=new Date(now.getTime()-86400000);
  if(d.toDateString()===y.toDateString()) return LANG==="fr"?"hier":"yest.";

/* =====================================================================
   SENTINELLE BOUTON RETOUR (système de couches — identique au marché
   20261002c : vdCouche / VD_BACK / VD_IGNORE). Le bouton retour du
   téléphone ferme le fil ouvert ou la modal, jamais la page.
   ===================================================================== */
var VD_BACK=0, VD_IGNORE=0;
function vdBackPose(){ try{ history.pushState({vdCouche:1},"",location.href); VD_BACK++; }catch(e){} }
function vdBackRetire(){ if(VD_BACK>0){ VD_BACK--; VD_IGNORE++; try{ history.back(); }catch(e){} } }
function vdFermerModalBrut(){
  var r=$("modalRoot");
  if(r){ r.style.display="none"; r.innerHTML=""; }
}
function vdFermerThreadBrut(){ closeThreadPane(); }
function vdFermerCoucheHaute(){
  var mr=$("modalRoot");
  if(mr&&mr.style.display==="block"&&mr.firstChild){ vdFermerModalBrut(); return; }
  if(CHAT&&CHAT.open){ vdFermerThreadBrut(); return; }
}
/* (correctif maison) sentinelle de depart : garantit qu'un premier
   appui sur Retour ne fait jamais disparaitre la page. */
var vdSentinelleDepart = false;
try {
  if (!history.state || !history.state.vdCouche) {
    history.pushState({ vdDepart: 1 }, "", location.href);
    vdSentinelleDepart = true;
  }
} catch (e) {}
window.addEventListener("popstate",function(){
  if(VD_IGNORE>0){ VD_IGNORE--; return; }
  if(VD_BACK>0){ VD_BACK--; vdFermerCoucheHaute(); return; }
  /* plus rien d'ouvert : on revient au marche plutot que de quitter */
  if (vdSentinelleDepart) { vdSentinelleDepart = false; try { location.href = "./shalom-square.html"; } catch (e) {} }
});

   ===================================================================== */
function pairThreadId(a,b,suffix){ return [a,b].sort().join("_")+(suffix?("__"+suffix):""); }
function peerOf(threadId){
  var me=FB.auth&&FB.auth.currentUser; if(!me) return null;
  var parts=String(threadId).split("__")[0].split("_");
  for(var i=0;i<parts.length;i++){ if(parts[i]&&parts[i]!==me.uid) return parts[i]; }
  return null;
}
function listingKeyOf(threadId){
  var parts=String(threadId).split("__");
  if(parts.length<2) return null;
  var suf=parts[1];
  return suf.indexOf("market")===0 ? suf.slice(6) : null;
}
function sendMarketMessage(threadId,payload,cb,presetKey){
  var me=FB.auth&&FB.auth.currentUser;
  if(!me||!FB.ready){ cb&&cb(false,"auth"); return; }
  var peer=peerOf(threadId);
  if(!peer){ cb&&cb(false,"peer"); return; }
  try{
    var msgId=presetKey||FB.db.ref("chats/"+threadId+"/messages").push().key;
    var now=Date.now();
    var myName=(FB.profile&&FB.profile.name)||me.displayName||(me.email||"").split("@")[0]||"Utilisateur";
    var peerName=PEER_NAMES.get(peer)||"Utilisateur";
    var preview=payload.quote?("🧾 "+t("listing_ctx")+" : "+fmtXAF(payload.quote.price)):(payload.text||"").slice(0,100);
    var msg={from:me.uid,to:peer,timestamp:now,readBy:{}};
    msg.readBy[me.uid]=true;
    if(payload.text) msg.text=payload.text;
    if(payload.quote) msg.quote=payload.quote;
    if(payload.autoReply) msg.autoReply=true;
    FB.db.ref("userThreads/"+me.uid+"/"+threadId).set(true).catch(function(){});
    FB.db.ref("userThreads/"+peer+"/"+threadId).set(true).catch(function(){});
    var parts={}; parts[me.uid]=true; parts[peer]=true;
    FB.db.ref("chats/"+threadId+"/meta/participants").update(parts).catch(function(){});
    var names={}; names[me.uid]=myName; names[peer]=peerName;
    FB.db.ref("chats/"+threadId+"/meta").update({names:names,lastMessage:preview,lastAt:now,lastFrom:me.uid}).catch(function(){});
    FB.db.ref("userInboxes/"+peer+"/threads/"+threadId).update({peerUid:me.uid,peerName:myName,lastMessage:preview,lastAt:now,lastFrom:me.uid}).catch(function(){});
    FB.db.ref("userInboxes/"+me.uid+"/threads/"+threadId).update({peerUid:peer,peerName:peerName,lastMessage:preview,lastAt:now,lastFrom:me.uid}).catch(function(){});
    FB.db.ref("userInboxes/"+peer+"/threads/"+threadId+"/unread").transaction(function(c){ return (c||0)+1; }).catch(function(){});
    FB.db.ref("chats/"+threadId+"/messages/"+msgId).set(msg).then(function(){ cb&&cb(true,msgId); }).catch(function(e){ cb&&cb(false,e); });
  }catch(e){ cb&&cb(false,e); }
}
var RENDERED_KEYS=new Map();
function preMarkThreadMsg(threadId,key){
  if(!RENDERED_KEYS.has(threadId)) RENDERED_KEYS.set(threadId,new Set());
  RENDERED_KEYS.get(threadId).add(key);
}
function subscribeThread(threadId,cb){
  if(!FB.ready) return null;
  var ref=FB.db.ref("chats/"+threadId+"/messages").limitToLast(80);
  var h=function(snap){
    var m=snap.val()||{}; var key=snap.key;
    if(!RENDERED_KEYS.has(threadId)) RENDERED_KEYS.set(threadId,new Set());
    var seen=RENDERED_KEYS.get(threadId);
    if(seen.has(key)) return;
    seen.add(key);
    cb(m,key);
  };
  ref.on("child_added",h,function(err){ console.warn("chat listener:",err&&err.message); });
  return function(){ ref.off("child_added",h); };
}
function markThreadRead(threadId){
  var me=FB.auth&&FB.auth.currentUser;

  FB.db.ref("userInboxes/"+me.uid+"/threads/"+threadId+"/unread").set(0).catch(function(){});
}

function onFbUser(u){
  renderAuth();
  if(INBOX_UNSUB){ try{ INBOX_UNSUB(); }catch(e){} INBOX_UNSUB=null; }
  if(CHAT.open) closeThreadPane();
  INBOX={}; renderInbox();
  if(u){
    FB.db.ref("profiles/"+u.uid).once("value").then(function(snap){
      FB.profile=snap.val()||{};
      renderAuth();
    }).catch(function(){});
    PEER_NAMES.set(u.uid,(FB.profile&&FB.profile.name)||u.displayName||(u.email||"").split("@")[0]||"");
    try{
      var ref=FB.db.ref("userInboxes/"+u.uid+"/threads");
      INBOX_UNSUB=function(){ try{ ref.off("value"); }catch(e){} };
      var firstSnap=true, prevLastAt={};
      ref.on("value",function(snap){
        var v=(snap&&snap.val())||{};
        INBOX=v;
        var n=0;
        Object.keys(v).forEach(function(k){ var th=v[k]; if(th&&th.unread>0) n+=Number(th.unread)||0; });
        TOTAL_UNREAD=n; updateTitleBadge();
        /* notification des nouveaux messages des fils NON ouverts */
        if(!firstSnap){
          var notify=null;
          Object.keys(v).forEach(function(k){
            var th=v[k]||{};
            var nowAt=Number(th.lastAt)||0, wasAt=prevLastAt[k]||0;
            if(nowAt>wasAt&&th.lastFrom&&FB.user&&th.lastFrom!==FB.user.uid
               &&!(CHAT.open&&CHAT.tid===k&&document.visibilityState==="visible")){
              notify={tid:k,name:th.peerName||"Shalom Square",text:th.lastMessage||""};
            }
          });
          if(notify){ showBanner("💬",notify.name,notify.text,notify.tid); beep(); vibrate(); }
        }
        firstSnap=false;
        prevLastAt={};
        Object.keys(v).forEach(function(k){ prevLastAt[k]=Number(v[k]&&v[k].lastAt)||0; });
        renderInbox();
        if(PENDING_THREAD){ var pt=PENDING_THREAD; PENDING_THREAD=null; openThread(pt); }
      },function(err){ console.warn("inbox listener:",err&&err.message); });
    }catch(e){}
  } else {
    FB.profile=null; TOTAL_UNREAD=0; updateTitleBadge();
  }
}

/* ---------- rendu de la liste des conversations ---------- */
function renderInbox(){

  /* (correctif maison) ne garder que les conversations nees dans la
     boutique : elles portent le suffixe « __market ». Les autres
     appartiennent a JobMarket et s'y consultent — rien n'est perdu. */
  function vdFilsDeLaBoutique(tid){ return String(tid).indexOf("__market") !== -1; }
  var vdTousLesFils = Object.keys(INBOX);
  var vdAutres = vdTousLesFils.filter(function(x){ return !vdFilsDeLaBoutique(x); }).length;

/* (correctif maison) LE MEME THEME QUE LES DEUX AUTRES PAGES.
   L'application et le marche partagent « jmc_theme » (sombre / clair /
   automatique). La messagerie ne le lisait pas : on passait d'un marche
   clair a une messagerie sombre, sans comprendre. */
function vdThemeSysClair() {
  try { return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches); }
  catch (e) { return false; }
}
function vdAppliquerTheme() {
  try {
    var mode = "dark";
    try { var x = localStorage.getItem("jmc_theme"); if (x === "light" || x === "auto") mode = x; } catch (e) {}
    var clair = (mode === "light") || (mode === "auto" && vdThemeSysClair());
    if (document.body) document.body.classList.toggle("light", clair);
    document.documentElement.setAttribute("data-theme", clair ? "light" : "dark");
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", clair ? "#F4F5F7" : "#0A0A0F");
  } catch (e) {}
}
try {
  vdAppliquerTheme();
  /* le <body> n'existe pas forcement quand ce script s'execute */
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", vdAppliquerTheme);
  else vdAppliquerTheme();
  /* si le theme change dans l'app ou le marche pendant que cette page
     est ouverte, on suit sans rien demander */
  window.addEventListener("storage", function (e) { if (!e || e.key === "jmc_theme") vdAppliquerTheme(); });
} catch (e) {}

/* (correctif maison) LES PHOTOS AU BON FORMAT — MESURE A L'APPUI.
   Mesure sur la premiere vraie annonce en ligne :
       telle quelle ............ 139 Ko
       vignette de grille ....... 27 Ko  (w_400)  -> 5 fois moins
       petite vignette .......... 3,5 Ko (w_120)
   Sur une page de 24 annonces : 650 Ko au lieu de 3,3 Mo. Et le jour ou
   quelqu'un televerse une photo de 3 Mo prise au telephone, la grille
   pesera toujours 650 Ko.
   Cloudinary redimensionne et choisit le format tout seul : il suffit de
   le lui demander dans l'adresse. L'application JobMarket le fait deja.
   Les adresses etrangeres ou deja reglees ne sont pas touchees. */
function vdImg(u, largeur) {
  try {
    if (!u || typeof u !== "string") return "";
    if (u.indexOf("res.cloudinary.com") === -1) return u;
    if (u.indexOf("/upload/") === -1) return u;
    var apres = u.split("/upload/")[1] || "";
    if (/^[a-z]{1,3}_[^\/]*\//.test(apres)) return u;
    return u.replace("/upload/", "/upload/w_" + (largeur || 600) + ",q_auto,f_auto/");
  } catch (e) { return u || ""; }
}

function onThreadMsg(m,key){
  if(!m) return;
  /* (correctif maison) LES PHOTOS DE JOBMARKET S'AFFICHENT VRAIMENT.
     Avant : une photo envoyee depuis l'application devenait le texte
     « 📷 Photo » — on savait qu'il y avait une image, sans jamais la
     voir. Il fallait rouvrir JobMarket pour la regarder. C'est tout
     l'inverse d'une messagerie partagee. */
  var vdPhotos = [];
  try {
    if (m.imageUrl) vdPhotos.push(m.imageUrl);
    if (m.images && m.images.length) vdPhotos = vdPhotos.concat(m.images);
  } catch (e) {}
  if(!m.text&&!m.quote){
    /* messages riches venant de l'app JobMarket : photos, vocaux */
    if(vdPhotos.length) m.text="📷 "+(LANG==="fr"?"Photo":"Photo");
    else if(m.voice) m.text="🎤 "+(LANG==="fr"?"Message vocal":"Voice message");
    else return;
  }
  var me=FB.auth&&FB.auth.currentUser;
  var tid=CHAT.tid;
  var arr=threadMsgs(tid);
  var mine=me&&m.from===me.uid;
  /* si la bulle montre la photo, inutile de repeter « 📷 Photo » dessous */
  var vdTexte = m.text || "";
  if (vdPhotos.length && /^📷 /.test(vdTexte)) vdTexte = "";
  arr.push({who:mine?"me":"them",text:vdTexte,photos:vdPhotos,quote:m.quote,autoReply:!!m.autoReply,ts:m.timestamp||Date.now(),key:key});
  if(arr.length>300) arr.shift();
  if(CHAT.open&&CHAT.tid===tid){
    renderThread();
    if(!mine){
      if(document.visibilityState==="visible"){ markThreadRead(tid); }
      else { scheduleAwayReply(tid,m,arr); }
    }
  }
  if(!mine){
    notifyIncoming(tid,m);
  }
}

/* =====================================================================
   IA — mêmes modes que JobMarket Cameroon via le worker sécurisé
   (Llama 3.3 70B, Workers AI) : aucune clé dans la page.
   ===================================================================== */
var AI_URL="https://jobmarket-chat-proxy.ghislaintankat.workers.dev";
var AI_BUSY=false;
function aiFetch(body,timeoutMs){
  return new Promise(function(resolve){
    try{
      var ac=("AbortController" in window)?new AbortController():null;
      var to=setTimeout(function(){ if(ac) ac.abort(); },timeoutMs||9000);
      fetch(AI_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(body),
        signal:ac?ac.signal:undefined
      }).then(function(r){
        clearTimeout(to);
        return r.json().catch(function(){ resolve(null); });
      }).then(function(j){ resolve(j||null); })
      .catch(function(){ resolve(null); });
    }catch(e){ resolve(null); }
  });
}
function buildAiContext(){
  var arr=threadMsgs(CHAT.tid).slice(-12);

    return who+" : "+String(body).slice(0,150);
  }).filter(function(s){ return s.split(" : ")[1]; });
  var l=CHAT.listing;
  return {
    lastMessages:msgs,
    proTitle:(FB.profile&&FB.profile.name)||"",
    proSkills:"",
    availability:(FB.profile&&FB.profile.availability)||"",
    jobContext:l?String(l.title+" — "+(l.price?fmtXAF(l.price):"")+(l.city?" ("+l.city+")":"")).slice(0,300):"Marché Shalom Square (biens et denrées, Cameroun)",

  window.vdQuiEcrit=vdQuiEcrit; window.vdPresenceTexte=vdPresenceTexte;
  window.vdFileAjouter=vdFileAjouter; window.vdFileLire=vdFileLire;
  window.vdFileTraiter=vdFileTraiter; window.vdSeparateurJour=vdSeparateurJour;
}catch(e){}
</script>

<script>
/* (correctif maison 20261006) VEILLE DU CHAT — rend visibles les
   fonctions posees par les blocs precedents, sans modifier le rendu
   de la page livree. */
var VD_VU = { tid: null, dernier: "" };

/* 1. LE BANDEAU D'ALERTE, juste au-dessus du champ de reponse. */
function vdPoserBandeau(){
  try{
    var zone = document.getElementById("chatInput");
    if(!zone || !zone.parentElement) return "";
    var b = document.getElementById("vdAlerteChat");
    if(!CHAT || !CHAT.open || !CHAT.tid){ if(b) b.style.display="none"; return ""; }
    var ms = (typeof threadMsgs === "function" ? threadMsgs(CHAT.tid) : []) || [];
    var me = FB && FB.auth && FB.auth.currentUser;
    var dernier = null;
    for(var i=ms.length-1;i>=0;i--){ var m=ms[i]; if(m && m.text && (!me || m.from!==me.uid)){ dernier=m; break; } }
    if(!dernier){ if(b) b.style.display="none"; return ""; }
    var cles = vdChatRisque(dernier.text), hotes = vdLiensSuspects(dernier.text);
    if(!cles.length && !hotes.length){ if(b) b.style.display="none"; return ""; }
    var txt = cles.length ? vdMessageRisque(cles)
      : "🔗 Ce message renvoie vers " + hotes[0] + ". N'y entre jamais tes codes.";
    if(!b){
      b = document.createElement("div"); b.id = "vdAlerteChat";
      zone.parentElement.insertBefore(b, zone);
    }
    b.style.cssText = "margin:8px;padding:9px 11px;border-radius:10px;font-size:12.5px;line-height:1.5;"
      + "background:rgba(231,76,60,.12);border:1px solid rgba(231,76,60,.45);";
    b.innerHTML = esc(txt)
      + '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">'
      + '<button type="button" aria-label="Bloquer ce contact" onclick="vdBloquerFil()" style="flex:1;min-width:110px;padding:7px;border:1px solid var(--bd,#333);background:none;color:inherit;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;">🚫 Bloquer</button>'
      + '<button type="button" aria-label="Signaler cette conversation" onclick="vdSignalerFil()" style="flex:1;min-width:110px;padding:7px;border:none;background:var(--acc,#38bdf8);color:#04121f;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;">🚩 Signaler</button>'
      + '</div>';
    b.style.display = "block";
    return cles.length ? cles.join(",") : "lien";
  }catch(e){ return ""; }
}
function vdBloquerFil(){
  try{ var p = CHAT && CHAT.peer; if(!p) return false; vdBasculerBlocage(p); vdMasquerBloques(); return true; }catch(e){ return false; }
}
function vdSignalerFil(){
  try{
    var ms = (typeof threadMsgs === "function" ? threadMsgs(CHAT && CHAT.tid) : []) || [];
    var d = ms.length ? (ms[ms.length-1].text || "") : "";
    return vdSignalerConversation(CHAT && CHAT.peer, d);
  }catch(e){ return false; }
}

/* 2. LES CONTACTS BLOQUES DISPARAISSENT DE LA LISTE. */
function vdMasquerBloques(){
  try{
    var n = 0, liste = document.getElementById("convList");
    if(!liste) return 0;
    liste.querySelectorAll("[data-tid]").forEach(function(el){
      var tid = el.getAttribute("data-tid") || "";
      var parts = String(tid).split("__")[0].split("_");
      var me = FB && FB.auth && FB.auth.currentUser;
      var peer = "";
      for(var i=0;i<parts.length;i++){ if(parts[i] && (!me || parts[i]!==me.uid)) { peer = parts[i]; break; } }
      if(peer && vdEstBloque(peer)){ el.style.display = "none"; n++; }
      else if(el.style.display === "none") el.style.display = "";
    });
    return n;
  }catch(e){ return 0; }
}

/* 3. LE BROUILLON PAR CONVERSATION : on ne perd plus ce qu'on tape. */
function vdBrouillonVeille(){
  try{
    var i = document.getElementById("chatInput");
    if(!i) return false;
    if(!i.__vdPose){
      i.__vdPose = true;
      i.addEventListener("input", function(){
        try{ if(CHAT && CHAT.tid) vdBrouillonEcrire(CHAT.tid, i.value); }catch(e){}
        try{ if(CHAT && CHAT.tid) vdEcritEnCours(CHAT.tid, !!i.value); }catch(e){}
      });
    }
    var tid = CHAT && CHAT.tid;
    if(tid && VD_VU.tid !== tid){
      VD_VU.tid = tid;
      var brouillon = vdBrouillonLire(tid);
      if(brouillon && !i.value){ i.value = brouillon; try{ toast("✍️ Ton brouillon a ete retrouve"); }catch(e){} }
    }
    return true;
  }catch(e){ return false; }
}

/* 4. LA BARRE HORS LIGNE DIT COMBIEN DE MESSAGES ATTENDENT. */
function vdBarreAttente(){
  try{
    var bar = document.getElementById("offlineBar");
    if(!bar) return 0;
    var n = (vdFileLire() || []).length;
    var hl = (typeof navigator !== "undefined" && navigator.onLine === false);
    if(!n && !hl) return 0;
    var e = document.getElementById("vdAttente");
    if(!e){ e = document.createElement("span"); e.id = "vdAttente"; e.style.cssText="margin-left:8px;font-weight:800;"; bar.appendChild(e); }
    e.textContent = n ? ("⏳ " + n + " message(s) en attente d'envoi") : "";
    return n;
  }catch(e){ return 0; }
}

function vdVeilleChat(){
  try{
    if(window.__vdVeille) return false;
    window.__vdVeille = setInterval(function(){
      try{ vdPoserBandeau(); }catch(e){}
      try{ vdBrouillonVeille(); }catch(e){}
      try{ vdMasquerBloques(); }catch(e){}
      try{ vdBarreAttente(); }catch(e){}
    }, 1600);
    return true;
  }catch(e){ return false; }
}
try{ document.addEventListener("DOMContentLoaded", function(){ try{ vdVeilleChat(); }catch(e){} }); }catch(e){}
try{ if(document.readyState !== "loading") vdVeilleChat(); }catch(e){}
try{
  window.vdPoserBandeau=vdPoserBandeau; window.vdBloquerFil=vdBloquerFil;
  window.vdSignalerFil=vdSignalerFil; window.vdMasquerBloques=vdMasquerBloques;
  window.vdBrouillonVeille=vdBrouillonVeille; window.vdBarreAttente=vdBarreAttente;
  window.vdVeilleChat=vdVeilleChat;
}catch(e){}
</script>
</body>
</html>
