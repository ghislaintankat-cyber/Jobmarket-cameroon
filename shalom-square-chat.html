<!DOCTYPE html>
<html lang="fr" data-app-build="20261003a">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shalom Square — Messagerie sécurisée</title>
<meta name="description" content="Messagerie sécurisée Shalom Square — discutez avec les vendeurs et acheteurs d'objets et de denrées partout au Cameroun. Synchronisé avec JobMarket Cameroon.">
<meta name="theme-color" content="#0A0A0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A0A0F'/%3E%3Ctext x='32' y='42' font-size='32' text-anchor='middle'%3E%F0%9F%9B%8D%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{
  --gold:#FFD700; --gold2:#B8860B; --goldink:#0A0A0F;
  --accent:#2D6CDF; --red:#EF4444; --stars:#FFC53D; --ok:#25D366;
  --bg:#0A0A0F; --card:#151521; --card2:#1B1B2B; --line:rgba(255,255,255,.09);
  --ink:#ECECF4; --muted:#9CA0B0;
  --shadow:0 1px 3px rgba(0,0,0,.5); --shadow-lg:0 14px 38px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
/* (correctif maison) hauteur qui ne saute pas quand la barre du
   navigateur se cache : voir dvh. overflow:hidden = seules les zones
   internes defilent, jamais la page entiere. */
html{height:100dvh}
body{height:100dvh;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--ink);overflow:hidden;
  display:flex;flex-direction:column;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:inherit}
a{color:var(--gold);text-decoration:none}

/* ---------- barre du haut ---------- */
.topbar{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:var(--card);border-bottom:1px solid var(--line);
  padding-top:calc(10px + env(safe-area-inset-top));flex-shrink:0;z-index:30;
}
.logo{display:flex;align-items:center;gap:9px;min-width:0}
.logo-ic{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold2));
  display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.logo b{font-size:14.5px;letter-spacing:.2px;white-space:nowrap}
.logo .sub{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.topbar .grow{flex:1}
.tbtn{
  border:1px solid var(--line);background:var(--card2);border-radius:10px;
  padding:7px 11px;font-size:12px;font-weight:700;white-space:nowrap;
}
.tbtn:hover{border-color:rgba(255,215,0,.4)}
.tbtn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--goldink);border:none}

/* ---------- layout 2 panneaux ---------- */
.main{flex:1;display:flex;min-height:0;position:relative}
.list-pane{
  width:100%;max-width:100%;display:flex;flex-direction:column;min-height:0;
  border-right:1px solid var(--line);background:var(--bg);
}
.searchbar{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-shrink:0}
.searchbar input{
  flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
  color:var(--ink);padding:10px 13px;font-size:13.5px;outline:none;
}
.searchbar input:focus{border-color:rgba(255,215,0,.45)}
.conv-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.conv{
  display:flex;gap:11px;padding:11px 13px;cursor:pointer;align-items:center;
  border-bottom:1px solid rgba(255,255,255,.045);
}
.conv:hover{background:var(--card)}
.conv.active{background:var(--card2)}
.conv .dot-unread{position:absolute;top:8px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--ok)}
.ava{
  width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:16px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);
}
.conv-mid{flex:1;min-width:0}
.conv-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.conv-prev{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.conv-prev .you{color:var(--gold);font-weight:700}
.conv-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.conv-time{font-size:10.5px;color:var(--muted)}
.badge{
  min-width:19px;height:19px;border-radius:999px;background:var(--ok);color:#06230f;
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;
}
.empty{
  padding:40px 22px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.7;
}
.empty .big{font-size:42px;margin-bottom:10px}

/* ---------- panneau fil ---------- */
.thread-pane{
  display:none;flex-direction:column;flex:1;min-width:0;min-height:0;background:var(--bg);
}
.thread-pane.open{display:flex}
@media(min-width:880px){
  .list-pane{width:355px;max-width:355px}
  .thread-pane{display:flex}
  .thread-pane .back-btn{display:none}
  .thread-empty-hero{display:flex}
}
@media(max-width:879px){
  .thread-pane.open{position:absolute;inset:0;z-index:40;background:var(--bg)}
}
.thread-empty-hero{
  display:none;flex:1;align-items:center;justify-content:center;flex-direction:column;gap:10px;
  color:var(--muted);font-size:13.5px;text-align:center;padding:30px;
}
.thread-head{
  display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--card);
  border-bottom:1px solid var(--line);flex-shrink:0;padding-top:calc(9px + env(safe-area-inset-top));
}
.back-btn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card2);
  font-size:16px;flex-shrink:0;
}
.thread-hmid{flex:1;min-width:0}
.thread-name{font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-tag{font-size:10px;font-weight:800;letter-spacing:.4px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;display:inline-block;margin-top:2px}
.chat-tag.secure{color:var(--ok);border-color:rgba(37,211,102,.45)}
.chat-tag.demo{color:var(--gold);border-color:rgba(255,215,0,.4)}
.hbtn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card2);
  font-size:15px;flex-shrink:0;position:relative;
}
.hbtn:disabled{opacity:.45;cursor:default}
.listing-chip{
  display:flex;align-items:center;gap:8px;margin:8px 12px 0;padding:8px 11px;border-radius:12px;
  background:var(--card);border:1px solid var(--line);font-size:12px;flex-shrink:0;cursor:pointer;
}
.listing-chip .lthumb{font-size:18px}
.listing-chip .ltitle{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listing-chip .lprice{color:var(--gold);font-weight:800;white-space:nowrap}

.bubbles{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:13px;display:flex;flex-direction:column;gap:9px;background:var(--bg)}
.bubble{max-width:84%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.45;animation:pop .18s ease-out;word-wrap:break-word}
@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:scale(1);opacity:1}}
.bubble.them{align-self:flex-start;background:var(--card2);border-bottom-left-radius:4px}
.bubble.me{align-self:flex-end;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--goldink);border-bottom-right-radius:4px;font-weight:600}
.bubble.sys{align-self:center;background:transparent;color:var(--muted);font-size:11.5px;text-align:center;border:1px dashed var(--line);border-radius:10px;padding:6px 12px;max-width:92%}
.msgtime{display:block;font-size:9.5px;opacity:.75;margin-top:3px;text-align:right}
.autolabel{display:block;font-size:9px;font-weight:800;letter-spacing:.5px;opacity:.8;margin-bottom:2px}
.quotecard{background:rgba(0,0,0,.18);border-radius:8px;padding:6px 8px;margin-bottom:5px;font-size:12px}
.bubble.them .quotecard{background:rgba(255,255,255,.06)}
.dim{color:var(--muted)}
.bubble .trans{margin-top:6px;padding-top:6px;border-top:1px dashed rgba(255,255,255,.25);font-size:12.5px;opacity:.92}
.bubble .trans b{font-size:9.5px;letter-spacing:.5px;opacity:.7;display:block;margin-bottom:2px}
/* (20261008b) écran d'appel, sonnerie entrante, photo et vocal */
.vdcall-ov{position:fixed;inset:0;z-index:9000;background:#07100c;display:none;
  flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(26px + env(safe-area-inset-top)) 14px calc(26px + env(safe-area-inset-bottom))}
.vdcall-ov.on{display:flex}
.vdcall-top{text-align:center;color:#e9fff4;z-index:3;position:relative}
.vdcall-name{font-size:21px;font-weight:800;line-height:1.2}
.vdcall-state{font-size:13.5px;opacity:.78;margin-top:5px;font-variant-numeric:tabular-nums}
.vdcall-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:none;z-index:1}
.vdcall-vid.on{display:block}
.vdcall-mini{position:absolute;right:12px;top:calc(14px + env(safe-area-inset-top));
  width:102px;height:138px;object-fit:cover;border-radius:13px;z-index:2;
  border:2px solid rgba(255,255,255,.35);background:#000;display:none}
.vdcall-mini.on{display:block}
.vdcall-acts{display:flex;gap:15px;z-index:3;flex-wrap:wrap;justify-content:center}
.vdcall-b{width:62px;height:62px;border-radius:50%;border:0;font-size:24px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.15);color:#fff}
.vdcall-b.hang{background:#e5484d}
.vdcall-b.take{background:#2ecc71}
.vdcall-b.off{background:#fff;color:#111}
.vdring{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:9500;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;
  display:none;align-items:center;gap:10px;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.vdring.on{display:flex}
.vdring-mid{flex:1;min-width:0}
.vdring-name{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vdring-kind{font-size:11.5px;color:var(--muted);margin-top:2px}
.vdring-b{width:40px;height:40px;border-radius:50%;border:0;font-size:17px;color:#fff;cursor:pointer}
.vdring-b.ok{background:#2ecc71}
.vdring-b.no{background:#e5484d}
.iobtn{width:40px;height:40px;border-radius:50%;flex-shrink:0;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.iobtn.rec{background:#e5484d;color:#fff;border-color:#e5484d}
.bubble.sys .vdcallline{font-weight:700}
.bubble audio{width:212px;max-width:100%;height:36px;display:block;margin:3px 0}
.bubble-acts{display:flex;gap:6px;align-self:flex-start;margin-top:-4px;padding:0 4px}
.bact{
  font-size:10.5px;font-weight:700;border:1px solid var(--line);border-radius:999px;
  background:var(--card);padding:3px 9px;color:var(--muted);
}
.bact:hover{color:var(--gold);border-color:rgba(255,215,0,.4)}

.qchips{display:flex;gap:7px;padding:8px 12px 2px;flex-wrap:wrap;flex-shrink:0}
.qchip{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--card);cursor:pointer;font-weight:700}
.qchip:hover{border-color:rgba(255,215,0,.4)}
.qchip.ai{border-color:rgba(45,108,223,.55);color:#8FB7FF;background:rgba(45,108,223,.12)}
.qchip.ai.busy{opacity:.55;pointer-events:none}

.chat-input{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);flex-shrink:0;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.chat-input input{
  flex:1;background:var(--card);border:1px solid var(--line);border-radius:999px;
  color:var(--ink);padding:11px 16px;font-size:13.5px;outline:none;
}
.chat-input input:focus{border-color:rgba(255,215,0,.45)}
.sendbtn{
  width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:var(--goldink);font-size:17px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
}
.sendbtn:disabled{opacity:.5}

/* ---------- banniere notif heads-up ---------- */
.banner{
  position:fixed;top:0;left:0;right:0;z-index:400;transform:translateY(-110%);
  transition:transform .28s cubic-bezier(.2,.9,.3,1.2);
  background:var(--card2);border-bottom:1px solid var(--line);box-shadow:var(--shadow-lg);
  display:flex;gap:11px;align-items:center;padding:11px 14px;cursor:pointer;
  padding-top:calc(11px + env(safe-area-inset-top));
}
.banner.show{transform:translateY(0)}
.banner .b-ic{font-size:22px}
.banner .b-title{font-size:12.5px;font-weight:800}
.banner .b-text{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70vw}

/* ---------- modal ---------- */
.modal-veil{
  position:fixed;inset:0;background:rgba(4,4,8,.72);z-index:300;display:flex;
  align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px);
}
.modal{
  background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:420px;width:100%;
  padding:20px;box-shadow:var(--shadow-lg);max-height:86vh;overflow-y:auto;
}
.field{margin-bottom:11px}
.field label{display:block;font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:5px;letter-spacing:.3px}
.field input{
  width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;
  color:var(--ink);padding:11px 13px;font-size:14px;outline:none;
}
.field input:focus{border-color:rgba(255,215,0,.5)}
.btn{
  border-radius:12px;padding:12px 16px;font-size:13.5px;font-weight:800;cursor:pointer;
  border:1px solid var(--line);background:var(--card2);width:100%;
}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--goldink);border:none}
.btn-ghost{background:transparent}
.formerr{color:var(--red);font-size:12px;min-height:16px;margin:4px 0 8px}
.two{display:flex;gap:10px}
.two>*{flex:1}

.toast{
  position:fixed;bottom:18px;left:50%;transform:translate(-50%,140%);z-index:500;
  background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:12px;
  padding:11px 18px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);
  transition:transform .25s ease;max-width:88vw;text-align:center;
}
.toast.show{transform:translate(-50%,0)}

.offline-bar{
  display:none;background:rgba(239,68,68,.14);border-bottom:1px solid rgba(239,68,68,.4);
  color:#FCA5A5;font-size:11.5px;font-weight:700;text-align:center;padding:6px 10px;flex-shrink:0;
}
.offline-bar.show{display:block}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--card2);border-radius:8px}

/* (correctif maison) THEME CLAIR — valeurs identiques a celles du marche,
   pour que les deux pages soient rigoureusement de la meme couleur. */
body.light{
  --bg:#F4F5F7; --card:#FFFFFF; --card2:#F0F1F4; --line:#E4E7EF;
  --ink:#14161B; --muted:#5C6270;
  --shadow:0 1px 3px rgba(20,22,30,.08); --shadow-lg:0 14px 34px rgba(20,22,30,.16);
}
/* photo recue depuis JobMarket, affichee dans la bulle */
.msgphoto{display:block;max-width:220px;width:100%;border-radius:10px;margin:4px 0;
  cursor:zoom-in;background:rgba(255,255,255,.05);}
</style>
</head>
<body>

<div class="topbar">
  <a class="logo" href="./shalom-square.html" id="backLink" title="Retour au marché">
    <div class="logo-ic">🛍️</div>
    <div style="min-width:0">
      <b>Shalom Square</b>
      <div class="sub" data-i18n="app_sub" id="appSub">MESSAGERIE SÉCURISÉE</div>
    </div>
  </a>
  <div class="grow"></div>
  <button class="tbtn" id="langBtn" onclick="toggleLang()">EN</button>
  <button class="tbtn gold" id="authBtn" onclick="authClick()">🔐 <span data-i18n="login_btn">Connexion</span></button>
</div>
<div class="offline-bar" id="offlineBar" data-i18n="offline_bar">📡 Connexion à la base sécurisée en cours…</div>

<div class="main">
  <aside class="list-pane" aria-label="Conversations">
    <div class="searchbar">
      <input id="searchInput" type="search" data-i18n-ph="search_ph" placeholder="Rechercher une conversation…" oninput="renderInbox()">
    </div>
    <div class="conv-scroll" id="convList"></div>
  </aside>

  <section class="thread-pane" id="threadPane" aria-label="Conversation">
    <div class="thread-empty-hero" id="threadHero">
      <div style="font-size:46px">💬</div>
      <b data-i18n="hero_title" style="color:var(--ink);font-size:15px">Sélectionnez une conversation</b>
      <span data-i18n="hero_p">Vos discussions avec les vendeurs et acheteurs apparaissent ici — elles sont synchronisées avec l'app JobMarket Cameroon.</span>
    </div>
    <div id="threadUI" style="display:none;flex-direction:column;flex:1;min-height:0">
      <div class="thread-head">
        <button class="back-btn" onclick="closeThreadUI()" aria-label="Retour">←</button>
        <a class="back-btn" id="toMarketBtn" href="./shalom-square.html" title="Retour au marché" aria-label="Retour au marché" style="text-decoration:none">🛍️</a>
        <div class="ava" id="thAva" style="width:38px;height:38px;font-size:14px">💬</div>
        <div class="thread-hmid">
          <div class="thread-name" id="thName">…</div>
          <span class="chat-tag secure" id="thTag" data-i18n="secure_tag">CHAT SÉCURISÉ JOBMARKET</span>
        </div>
        <button class="hbtn" id="scamBtn" onclick="aiScamCheck()" title="Vérification IA de l'annonce" style="display:none">🛡️</button>
                <button class="hbtn" id="vdRechFilBtn" title="Chercher dans la conversation" aria-label="Chercher dans la conversation">🔎</button>
        <button class="hbtn" id="vdVenduBtn" title="Marquer vendu" aria-label="Marquer vendu" style="display:none">✅</button>
        <button class="hbtn" id="vdCallAudioBtn" title="Appel audio" aria-label="Appel audio">📞</button>
        <button class="hbtn" id="vdCallVideoBtn" title="Appel vidéo" aria-label="Appel vidéo">🎥</button>
        <button class="hbtn" id="inAppBtn" onclick="openInApp()" title="Ouvrir dans l'app JobMarket" style="display:none">📲</button>
      </div>
      <div class="listing-chip" id="listingChip" style="display:none" onclick="openListing()">
        <span class="lthumb" id="lcThumb">📦</span>
        <span class="ltitle" id="lcTitle"></span>
        <span class="lprice" id="lcPrice"></span>
      </div>
      <div id="vdFilRecherche" style="display:none;padding:7px 12px 0"><input id="vdFilRechChamp" type="text" placeholder="Chercher dans cette conversation…" style="width:100%;background:var(--card);border:1px solid var(--line);border-radius:999px;color:var(--ink);padding:8px 14px;font-size:13px;outline:none"></div>
      <div class="bubbles" id="bubbles"></div>
      <div class="qchips" id="aiRow"></div>
      <div class="qchips" id="quickChips"></div>
      <div class="chat-input">
        <input id="chatInput" type="text" data-i18n-ph="chat_ph" placeholder="Écrivez un message…"
          onkeydown="if(event.key==='Enter'){event.preventDefault();sendText();}">
                <button class="iobtn" id="vdLieuBtn" title="Partager ma position" aria-label="Partager ma position">📍</button>
        <input id="vdPhotoFile" type="file" accept="image/*" style="display:none">
        <button class="iobtn" id="vdPhotoBtn" title="Envoyer une photo" aria-label="Envoyer une photo">📷</button>
        <button class="iobtn" id="vdVoiceBtn" title="Message vocal" aria-label="Message vocal">🎤</button>
        <button class="sendbtn" onclick="sendText()" aria-label="Envoyer">➤</button>
      </div>
    </div>
  </section>
</div>

<!-- (20261008b) écran d'appel audio / vidéo -->
<div class="vdcall-ov" id="vdCallOv" role="dialog" aria-modal="true" aria-label="Appel en cours">
  <video class="vdcall-vid" id="vdCallRemote" playsinline autoplay></video>
  <video class="vdcall-mini" id="vdCallMini" playsinline autoplay muted></video>
  <audio id="vdCallAudio" autoplay></audio>
  <div class="vdcall-top">

var VD_BACK=0, VD_IGNORE=0;
function vdBackPose(){ try{ history.pushState({vdCouche:1},"",location.href); VD_BACK++; }catch(e){} }
function vdBackRetire(){ if(VD_BACK>0){ VD_BACK--; VD_IGNORE++; try{ history.back(); }catch(e){} } }

   appui sur Retour ne fait jamais disparaitre la page. */
var vdSentinelleDepart = false;

  if (!history.state || !history.state.vdCouche) {
    history.pushState({ vdDepart: 1 }, "", location.href);
    vdSentinelleDepart = true;
  }
} catch (e) {}
window.addEventListener("popstate",function(){
  if(VD_IGNORE>0){ VD_IGNORE--; return; }
  if(VD_BACK>0){ VD_BACK--; vdFermerCoucheHaute(); return; }

    var msg={from:me.uid,to:peer,timestamp:now,readBy:{}};
    msg.readBy[me.uid]=true;
    if(payload.text) msg.text=payload.text;
    if(payload.quote) msg.quote=payload.quote;
    if(payload.autoReply) msg.autoReply=true;
    /* (20261008b) vdChampsRiches : sans ces deux lignes, une photo ou
       un vocal arrivaient chez l'autre comme une bulle vide. */
    if(payload.imageUrl) msg.imageUrl=payload.imageUrl;
    if(payload.voice){ msg.voice=payload.voice; if(payload.duree) msg.duree=Math.round(payload.duree); }
    /* (20261008c) vdChampLieu : sans cette ligne la position partirait vide */
    if(payload.lieu && payload.lieu.lat!=null) msg.lieu={lat:Number(payload.lieu.lat),lng:Number(payload.lieu.lng)};
    if(!payload.text&&!payload.quote&&payload.lieu) preview="📍 Position partagée";
    if(!payload.text&&!payload.quote){
      preview = payload.imageUrl ? "📷 Photo" : (payload.voice ? "🎤 Message vocal" : preview);
    }
    FB.db.ref("market_threads/"+me.uid+"/"+threadId).set(true).catch(function(){});
    FB.db.ref("market_threads/"+peer+"/"+threadId).set(true).catch(function(){});
    var parts={}; parts[me.uid]=true; parts[peer]=true;
    FB.db.ref("market_chats/"+threadId+"/meta/participants").update(parts).catch(function(){});
    var names={}; names[me.uid]=myName; names[peer]=peerName;
    FB.db.ref("market_chats/"+threadId+"/meta").update({names:names,lastMessage:preview,lastAt:now,lastFrom:me.uid}).catch(function(){});
    FB.db.ref("market_inboxes/"+peer+"/threads/"+threadId).update({peerUid:me.uid,peerName:myName,lastMessage:preview,lastAt:now,lastFrom:me.uid}).catch(function(){});
    FB.db.ref("market_inboxes/"+me.uid+"/threads/"+threadId).update({peerUid:peer,peerName:peerName,lastMessage:preview,lastAt:now,lastFrom:me.uid}).catch(function(){});
    FB.db.ref("market_inboxes/"+peer+"/threads/"+threadId+"/unread").transaction(function(c){ return (c||0)+1; }).catch(function(){});
    FB.db.ref("market_chats/"+threadId+"/messages/"+msgId).set(msg).then(function(){ cb&&cb(true,msgId); }).catch(function(e){ cb&&cb(false,e); });
  }catch(e){ cb&&cb(false,e); }
}
var RENDERED_KEYS=new Map();
function preMarkThreadMsg(threadId,key){
  if(!RENDERED_KEYS.has(threadId)) RENDERED_KEYS.set(threadId,new Set());

}
function subscribeThread(threadId,cb){
  if(!FB.ready) return null;
  var ref=FB.db.ref("market_chats/"+threadId+"/messages").limitToLast(80);
  var h=function(snap){
    var m=snap.val()||{}; var key=snap.key;
    if(!RENDERED_KEYS.has(threadId)) RENDERED_KEYS.set(threadId,new Set());
    var seen=RENDERED_KEYS.get(threadId);
    if(seen.has(key)) return;
    seen.add(key);
    cb(m,key);
  };
  ref.on("child_added",h,function(err){ console.warn("chat listener:",err&&err.message); });
  return function(){ ref.off("child_added",h); };
}

/* (correctif maison) LE MEME THEME QUE LES DEUX AUTRES PAGES.
   L'application et le marche partagent « jmc_theme » (sombre / clair /
   automatique). La messagerie ne le lisait pas : on passait d'un marche
   clair a une messagerie sombre, sans comprendre. */
function vdThemeSysClair() {
  try { return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches); }
  catch (e) { return false; }
}
function vdAppliquerTheme() {
  try {
    var mode = "dark";
    try { var x = localStorage.getItem("jmc_theme"); if (x === "light" || x === "auto") mode = x; } catch (e) {}
    var clair = (mode === "light") || (mode === "auto" && vdThemeSysClair());
    if (document.body) document.body.classList.toggle("light", clair);
    document.documentElement.setAttribute("data-theme", clair ? "light" : "dark");
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", clair ? "#F4F5F7" : "#0A0A0F");
  } catch (e) {}
}
try {
  vdAppliquerTheme();
  /* le <body> n'existe pas forcement quand ce script s'execute */
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", vdAppliquerTheme);
  else vdAppliquerTheme();
  /* si le theme change dans l'app ou le marche pendant que cette page
     est ouverte, on suit sans rien demander */
  window.addEventListener("storage", function (e) { if (!e || e.key === "jmc_theme") vdAppliquerTheme(); });
} catch (e) {}

/* (correctif maison) LES PHOTOS AU BON FORMAT — MESURE A L'APPUI.
   Mesure sur la premiere vraie annonce en ligne :
       telle quelle ............ 139 Ko
       vignette de grille ....... 27 Ko  (w_400)  -> 5 fois moins
       petite vignette .......... 3,5 Ko (w_120)
   Sur une page de 24 annonces : 650 Ko au lieu de 3,3 Mo. Et le jour ou
   quelqu'un televerse une photo de 3 Mo prise au telephone, la grille
   pesera toujours 650 Ko.
   Cloudinary redimensionne et choisit le format tout seul : il suffit de
   le lui demander dans l'adresse. L'application JobMarket le fait deja.
   Les adresses etrangeres ou deja reglees ne sont pas touchees. */
function vdImg(u, largeur) {
  try {
    if (!u || typeof u !== "string") return "";
    if (u.indexOf("res.cloudinary.com") === -1) return u;
    if (u.indexOf("/upload/") === -1) return u;
    var apres = u.split("/upload/")[1] || "";
    if (/^[a-z]{1,3}_[^\/]*\//.test(apres)) return u;
    return u.replace("/upload/", "/upload/w_" + (largeur || 600) + ",q_auto,f_auto/");
  } catch (e) { return u || ""; }
}

/* ═══════════════════════════════════════════════════════════════════
   (20261008b) APPELS AUDIO ET VIDEO DANS LA MESSAGERIE DE LA BOUTIQUE

   POURQUOI. La demande etait nette : « le chat de Shalom doit etre
   exactement developpe comme celui de JobMarket, mais je ne vois pas
   les appels video ou normal ». C'etait vrai : la page livree ne
   contenait ni RTCPeerConnection, ni getUserMedia, ni la moindre
   trace d'appel. On ne pouvait qu'ecrire.

   COMMENT. Meme architecture que JobMarket : WebRTC pair a pair, le
   STUN de Google plus le TURN maison lu dans « config/call » (le
   meme nœud, donc un seul endroit a regler). La signalisation passe
   par la base, dans « market_calls » — separee de JobMarket, comme
   le reste de la boutique depuis 20261008a.

   LE NŒUD. Chacun ECRIT dans la boite de l'autre et LIT dans la
   sienne :
       market_calls/<destinataire>/<idAppel> = { from, kind, sdp,
                                                 state, ice:{…} }
   L'appel porte le meme identifiant des deux cotes, donc aucune
   collision et aucun besoin de droit croise.

   L'HORLOGE. Piege connu et deja paye dans JobMarket : un appel
   etait jete parce que son horodatage paraissait « trop vieux »
   quand les deux telephones n'etaient pas a la meme heure. Ici
   l'instant est ecrit par le SERVEUR (ServerValue.TIMESTAMP) et
   compare avec le decalage lu dans « .info/serverTimeOffset ». Les
   deux cotes raisonnent donc sur la meme horloge.
   ═══════════════════════════════════════════════════════════════════ */
var VD_STUN = "stun:stun.l.google.com:19302";
var VD_TURN = null;
var VD_DECALAGE = 0;
function vdHeureServeur(){ return Date.now() + VD_DECALAGE; }
function vdLireDecalage(){
  try{
    if(!FB || !FB.db) return false;
    FB.db.ref(".info/serverTimeOffset").on("value", function(sn){
      var v = sn && sn.val();
      if(typeof v === "number" && Math.abs(v) < 86400000) VD_DECALAGE = v;
    });
    return true;
  }catch(e){ return false; }
}
function vdServeursIce(){
  return new Promise(function(res){
    var liste = [ { urls: VD_STUN } ];
    if(VD_TURN && VD_TURN.turnUrl){
      liste.push({ urls: VD_TURN.turnUrl, username: VD_TURN.username || "", credential: VD_TURN.credential || "" });
      return res(liste);
    }
    try{
      FB.db.ref("config/call").once("value").then(function(sn){
        var d = sn && sn.val();
        if(d && typeof d.turnUrl === "string" && d.turnUrl.indexOf("turn:") === 0){
          VD_TURN = { turnUrl: String(d.turnUrl).slice(0,120),
                      username: String(d.username || "").slice(0,80),
                      credential: String(d.credential || "").slice(0,120) };
          liste.push({ urls: VD_TURN.turnUrl, username: VD_TURN.username, credential: VD_TURN.credential });
        }
        res(liste);
      }).catch(function(){ res(liste); });
    }catch(e){ res(liste); }
  });
}

var VD_APPEL = null;      /* l'appel en cours, des deux cotes */
var VD_ENTRANT = null;    /* l'appel qui sonne, pas encore accepte */
var VD_ECOUTE_APPELS = "";

function vdAppelChrono(ms){
  var s = Math.max(0, Math.round((ms || 0) / 1000));
  var m = Math.floor(s / 60); s = s % 60;
  return (m < 10 ? "0" + m : "" + m) + ":" + (s < 10 ? "0" + s : "" + s);
}
function vdAppelDuree(ms){
  var s = Math.max(0, Math.round((ms || 0) / 1000));
  if(s < 60) return s + " s";
  var m = Math.floor(s / 60); s = s % 60;
  return m + " min " + (s < 10 ? "0" + s : "" + s) + " s";
}
function vdAppelEtat(txt){

/* La sonnerie est fabriquee, pas telechargee : aucun fichier de plus
   a charger, et elle marche hors ligne. */
var VD_SONNE = null;
function vdSonnerie(marche){
  try{
    if(!marche){
      if(VD_SONNE){
        try{ clearInterval(VD_SONNE.t); }catch(e){}
        try{ VD_SONNE.ctx.close(); }catch(e){}
        VD_SONNE = null;
        try{ if(navigator.vibrate) navigator.vibrate(0); }catch(e){}
      }
      return false;
    }
    if(VD_SONNE) return true;
    var C = window.AudioContext || window.webkitAudioContext;
    if(!C) return false;
    var ctx = new C();
    var bip = function(){
      try{
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = 880;
        o.connect(g); g.connect(ctx.destination);
        var n = ctx.currentTime;
        g.gain.setValueAtTime(0.0001, n);
        g.gain.exponentialRampToValueAtTime(0.2, n + 0.06);
        g.gain.exponentialRampToValueAtTime(0.0001, n + 0.5);
        o.start(n); o.stop(n + 0.55);
        try{ if(navigator.vibrate) navigator.vibrate([250, 180, 250]); }catch(e){}
      }catch(e){}
    };
    bip();
    VD_SONNE = { ctx: ctx, t: setInterval(bip, 1500) };
    return true;
  }catch(e){ return false; }
}

function vdAppelMonter(){
  return vdServeursIce().then(function(ice){
    if(!VD_APPEL) return false;
    var pc = new RTCPeerConnection({ iceServers: ice });
    VD_APPEL.pc = pc;
    VD_APPEL.face = "user";
    var contraintes = (VD_APPEL.kind === "video")
      ? { audio: true, video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } } }
      : { audio: true, video: false };
    return navigator.mediaDevices.getUserMedia(contraintes).then(function(flux){
      if(!VD_APPEL){ try{ flux.getTracks().forEach(function(p){ p.stop(); }); }catch(e){} return false; }
      VD_APPEL.local = flux;
      flux.getTracks().forEach(function(p){ try{ pc.addTrack(p, flux); }catch(e){} });
      var mini = document.getElementById("vdCallMini");
      if(mini && VD_APPEL.kind === "video"){ try{ mini.srcObject = flux; mini.muted = true; mini.play(); }catch(e){} }
      pc.ontrack = function(ev){
        var d = (ev.streams && ev.streams[0]) || null;
        if(!d || !VD_APPEL) return;
        VD_APPEL.distant = d;
        var v = document.getElementById("vdCallRemote");
        var a = document.getElementById("vdCallAudio");
        if(VD_APPEL.kind === "video" && v){ try{ v.srcObject = d; v.play(); }catch(e){} }
        if(a){ try{ a.srcObject = d; a.play(); }catch(e){} }
      };
      pc.onicecandidate = function(ev){
        if(!ev || !ev.candidate || !VD_APPEL) return;
        try{
          var moi = (FB.auth && FB.auth.currentUser) ? FB.auth.currentUser.uid : "";
          FB.db.ref("market_calls/" + VD_APPEL.pair + "/" + VD_APPEL.id + "/ice").push({
            from: moi,
            c: JSON.stringify(ev.candidate.toJSON ? ev.candidate.toJSON() : ev.candidate)
          }).catch(function(){});
        }catch(e){}
      };
      pc.onconnectionstatechange = function(){
        if(!VD_APPEL || !VD_APPEL.pc) return;
        var s = VD_APPEL.pc.connectionState;
        if(s === "connected") vdAppelEnCours();
        if(s === "failed" || s === "closed") vdAppelTerminer("coupe");
      };
      return true;
    });
  });
}

function vdAppelEcouterIce(base){
  try{
    var r = FB.db.ref(base + "/ice");
    var h = r.on("child_added", function(sn){
      var v = sn && sn.val();
      if(!v || !v.c || !VD_APPEL || !VD_APPEL.pc) return;
      var moi = (FB.auth && FB.auth.currentUser) ? FB.auth.currentUser.uid : "";
      if(v.from === moi) return;
      try{ VD_APPEL.pc.addIceCandidate(new RTCIceCandidate(JSON.parse(v.c))); }catch(e){}
    });
    if(VD_APPEL) VD_APPEL.ecoutes.push(function(){ try{ r.off("child_added", h); }catch(e){} });
    return true;
  }catch(e){ return false; }
}
function vdAppelEcouterMaBoite(){
  try{
    var me = FB.auth && FB.auth.currentUser;
    if(!me || !VD_APPEL) return false;
    var base = "market_calls/" + me.uid + "/" + VD_APPEL.id;

        vdAppelEtat(LANG === "fr" ? "Connexion…" : "Connecting…");
      }
    });
    VD_APPEL.ecoutes.push(function(){ try{ r.off("value", h); }catch(e){} });
    vdAppelEcouterIce(base);
    return true;
  }catch(e){ return false; }
}

function vdAppelDemarrer(kind){
  kind = (kind === "video") ? "video" : "audio";
  if(VD_APPEL){ toast(LANG === "fr" ? "⚠️ Un appel est déjà en cours" : "⚠️ A call is already running"); return false; }
  if(!CHAT.open || !CHAT.tid){ toast(LANG === "fr" ? "Ouvrez d’abord une conversation" : "Open a conversation first"); return false; }
  var me = FB.auth && FB.auth.currentUser;
  if(!me){ openSignIn(); return false; }
  var pair = peerOf(CHAT.tid);
  if(!pair){ toast(LANG === "fr" ? "Correspondant introuvable" : "Contact not found"); return false; }
  if(typeof vdEstBloque === "function" && vdEstBloque(CHAT.tid)){
    toast(LANG === "fr" ? "🚫 Cette conversation est bloquée" : "🚫 This conversation is blocked");
    return false;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof RTCPeerConnection === "undefined"){
    toast(LANG === "fr" ? "Ce navigateur ne sait pas téléphoner" : "This browser cannot place calls");
    return false;
  }
  var id = "";
  try{ id = FB.db.ref("market_calls/" + pair).push().key; }catch(e){ id = ""; }
  if(!id) id = "c" + Date.now();
  VD_APPEL = { id: id, pair: pair, tid: CHAT.tid, kind: kind, role: "appelant",
               pc: null, local: null, debut: 0, minuteur: null, ecoutes: [], repondu: false };
  var inbox = (typeof INBOX !== "undefined" && INBOX[CHAT.tid]) || {};
  vdAppelOuvrirEcran(vdNomEntete(inbox, pair), kind, true);
  vdAppelEtat(kind === "video" ? (LANG === "fr" ? "Appel vidéo…" : "Video call…") : (LANG === "fr" ? "Appel…" : "Calling…"));
  var take = document.getElementById("vdCallTake");
  if(take) take.style.display = "none";
  vdAppelMonter().then(function(ok){
    if(!ok || !VD_APPEL) return null;
    return VD_APPEL.pc.createOffer().then(function(off){
      return VD_APPEL.pc.setLocalDescription(off).then(function(){
        var myName = (FB.profile && FB.profile.name) || me.displayName || "Utilisateur";
        var enr = { from: me.uid, fromName: String(myName).slice(0, 40), kind: kind,
                    tid: CHAT.tid, state: "ringing", sdp: { type: off.type, sdp: off.sdp } };
        try{ enr.at = firebase.database.ServerValue.TIMESTAMP; }catch(e){ enr.at = vdHeureServeur(); }
        FB.db.ref("market_calls/" + pair + "/" + id).set(enr).catch(function(){ vdAppelTerminer("reseau"); });
        vdAppelEcouterMaBoite();
        VD_APPEL.sonnerieT = setTimeout(function(){
          if(VD_APPEL && VD_APPEL.id === id && !VD_APPEL.debut){
            try{ FB.db.ref("market_calls/" + pair + "/" + id).update({ state: "ended" }); }catch(e){}
            vdAppelTerminer("sansreponse");
          }
        }, 45000);
      });
    });
  }).catch(function(){ vdAppelTerminer("micro"); });
  return true;
}

function vdAppelEcouter(){
  try{
    var me = FB.auth && FB.auth.currentUser;
    if(!me || !FB.db) return false;
    if(VD_ECOUTE_APPELS === me.uid) return true;
    VD_ECOUTE_APPELS = me.uid;
    vdLireDecalage();
    FB.db.ref("market_calls/" + me.uid).limitToLast(6).on("child_added", function(sn){
      var v = sn && sn.val();
      if(!v || !v.from || !v.sdp) return;
      if(v.state !== "ringing") return;
      /* trop vieux : c'est un reste, pas un appel. L'ecart est mesure
         sur l'horloge du serveur, pas sur celle du telephone. */
      var age = vdHeureServeur() - Number(v.at || 0);
      if(Number(v.at || 0) > 0 && age > 90000){ try{ sn.ref.remove(); }catch(e){} return; }
      if(VD_APPEL || VD_ENTRANT){
        try{ FB.db.ref("market_calls/" + v.from + "/" + sn.key).update({ state: "declined" }); }catch(e){}
        return;
      }
      if(typeof vdEstBloque === "function" && v.tid && vdEstBloque(v.tid)){
        try{ FB.db.ref("market_calls/" + v.from + "/" + sn.key).update({ state: "declined" }); }catch(e){}
        try{ sn.ref.remove(); }catch(e){}
        return;
      }
      vdAppelEntrant(sn.key, v);
    });
    return true;
  }catch(e){ return false; }
}

function vdAppelRefuser(manque){
  var e = VD_ENTRANT; VD_ENTRANT = null;
  vdSonnerie(false);
  var r = document.getElementById("vdRing"); if(r) r.classList.remove("on");
  if(!e) return false;

  vdAppelTrace(e.tid, quoi + " · " + (manque
    ? (LANG === "fr" ? "manqué" : "missed")

function vdAppelEnCours(){
  if(!VD_APPEL || VD_APPEL.debut) return false;
  VD_APPEL.debut = Date.now();
  try{ clearTimeout(VD_APPEL.sonnerieT); }catch(e){}
  vdAppelEtat("00:00");
  VD_APPEL.minuteur = setInterval(function(){
    if(!VD_APPEL || !VD_APPEL.debut) return;
    vdAppelEtat(vdAppelChrono(Date.now() - VD_APPEL.debut));
  }, 1000);
  return true;
}
function vdAppelRaccrocher(){
  if(!VD_APPEL){ if(VD_ENTRANT) return vdAppelRefuser(false); return false; }
  try{ FB.db.ref("market_calls/" + VD_APPEL.pair + "/" + VD_APPEL.id).update({ state: "ended" }); }catch(e){}
  return vdAppelTerminer("raccroche");
}
function vdAppelTerminer(raison){
  var a = VD_APPEL; VD_APPEL = null;
  vdAppelFermerEcran();
  if(!a) return false;
  try{ clearTimeout(a.sonnerieT); }catch(e){}
  try{ clearInterval(a.minuteur); }catch(e){}
  (a.ecoutes || []).forEach(function(f){ try{ f(); }catch(e){} });
  try{ if(a.local) a.local.getTracks().forEach(function(p){ p.stop(); }); }catch(e){}
  try{ if(a.pc) a.pc.close(); }catch(e){}
  try{
    var me = FB.auth && FB.auth.currentUser;
    if(me) FB.db.ref("market_calls/" + me.uid + "/" + a.id).remove();
  }catch(e){}
  var quoi = (a.kind === "video")
    ? (LANG === "fr" ? "🎥 Appel vidéo" : "🎥 Video call")
    : (LANG === "fr" ? "📞 Appel audio" : "📞 Audio call");
  var duree = a.debut ? (Date.now() - a.debut) : 0;
  var texte;
  if(duree) texte = quoi + " · " + vdAppelDuree(duree);
  else if(raison === "refuse") texte = quoi + " · " + (LANG === "fr" ? "refusé" : "declined");
  else if(raison === "sansreponse") texte = quoi + " · " + (LANG === "fr" ? "sans réponse" : "no answer");
  else if(raison === "micro") texte = quoi + " · " + (LANG === "fr" ? "micro ou caméra refusé" : "mic or camera denied");
  else if(raison === "reseau") texte = quoi + " · " + (LANG === "fr" ? "réseau indisponible" : "network unavailable");
  else if(raison === "coupe") texte = quoi + " · " + (LANG === "fr" ? "connexion coupée" : "connection lost");
  else texte = quoi + " · " + (LANG === "fr" ? "terminé" : "ended");
  vdAppelTrace(a.tid, texte, a.kind, duree);
  return true;
}

/* La trace reste LOCALE a l'ecran et part dans le journal personnel.
   Elle n'est pas envoyee comme message : sinon les deux cotes en
   ecriraient chacun une et la conversation finirait pleine de
   doublons, avec des pastilles « non lu » pour rien. */
function vdAppelTrace(tid, texte, kind, duree){
  try{
    if(tid && typeof threadMsgs === "function"){
      var arr = threadMsgs(tid);
      arr.push({ who: "sys", sys: true, text: texte, ts: Date.now() });
      if(CHAT.open && CHAT.tid === tid) renderThread();
    }
    var me = FB.auth && FB.auth.currentUser;
    if(me && FB.db){
      FB.db.ref("market_calls_log/" + me.uid).push({
        tid: tid || "", kind: kind || "audio", texte: String(texte || "").slice(0, 80),
        duree: Math.round((duree || 0) / 1000), at: Date.now()
      }).catch(function(){});
    }
    return texte;
  }catch(e){ return texte; }
}

function vdAppelCouperCamera(){
  if(!VD_APPEL || !VD_APPEL.local) return false;
  var p = VD_APPEL.local.getVideoTracks()[0];

  p.enabled = !p.enabled;

function vdAppelChangerCamera(){
  if(!VD_APPEL || !VD_APPEL.pc || VD_APPEL.kind !== "video") return Promise.resolve(false);
  VD_APPEL.face = (VD_APPEL.face === "environment") ? "user" : "environment";
  var face = VD_APPEL.face;
  return navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: face } }).then(function(flux){
    var neuf = flux.getVideoTracks()[0];
    if(!neuf || !VD_APPEL){ try{ flux.getTracks().forEach(function(p){ p.stop(); }); }catch(e){} return false; }
    var envoyeur = null;
    VD_APPEL.pc.getSenders().forEach(function(s){ if(s.track && s.track.kind === "video") envoyeur = s; });
    if(envoyeur) try{ envoyeur.replaceTrack(neuf); }catch(e){}
    try{
      var anc = VD_APPEL.local.getVideoTracks()[0];
      if(anc){ VD_APPEL.local.removeTrack(anc); anc.stop(); }
      VD_APPEL.local.addTrack(neuf);
    }catch(e){}
    var mini = document.getElementById("vdCallMini");
    if(mini){ try{ mini.srcObject = VD_APPEL.local; }catch(e){} }
    return face;
  }).catch(function(){ return false; });
}

}
/* ═══════════════════════════════════════════════════════════════════
   (20261008b) ENVOYER UNE PHOTO ET UN MESSAGE VOCAL

   POURQUOI. La messagerie savait AFFICHER les photos venues de
   JobMarket mais pas en envoyer : il n'y avait aucun champ fichier
   dans la page, aucun MediaRecorder. Pour vendre un objet, montrer
   une photo dans la discussion est le geste le plus courant qui
   soit — « tu peux m'envoyer une photo du dos de l'appareil ? ».

   LE POIDS. La photo est reduite A 1280 PIXELS ET RECOMPRESSEE SUR
   L'APPAREIL avant le moindre octet envoye. Une photo de telephone
   de 3,5 Mo part a environ 160 Ko : vingt fois moins de forfait
   consomme, et l'envoi passe sur une connexion faible.
   ═══════════════════════════════════════════════════════════════════ */
var VD_CLOUD_IMG = "https://api.cloudinary.com/v1_1/dvoab3mzb/image/upload";
var VD_CLOUD_SON = "https://api.cloudinary.com/v1_1/dvoab3mzb/video/upload";
var VD_CLOUD_PRESET = "job_preset";

function vdReduirePhoto(fichier, cote, qualite){
  return new Promise(function(res){
    try{
      var lec = new FileReader();
      lec.onerror = function(){ res(null); };
      lec.onload = function(){
        var img = new Image();
        img.onerror = function(){ res(null); };
        img.onload = function(){
          try{
            var L = cote || 1280;
            var w = img.width, h = img.height;
            if(w > L || h > L){
              if(w > h){ h = Math.round(h * L / w); w = L; }
              else { w = Math.round(w * L / h); h = L; }
            }
            var cv = document.createElement("canvas");
            cv.width = w; cv.height = h;
            cv.getContext("2d").drawImage(img, 0, 0, w, h);
            res(cv.toDataURL("image/jpeg", qualite || 0.72));
          }catch(e){ res(null); }
        };
        img.src = lec.result;
      };
      lec.readAsDataURL(fichier);
    }catch(e){ res(null); }
  });
}
function vdVersBlob(dataUrl){
  try{
    var p = String(dataUrl || "").split(",");
    if(p.length < 2) return null;
    var bin = atob(p[1]);
    var n = bin.length, u = new Uint8Array(n);
    while(n--) u[n] = bin.charCodeAt(n);
    return new Blob([u], { type: "image/jpeg" });
  }catch(e){ return null; }
}
function vdTeleverser(blob, nom, adresse){
  return new Promise(function(res){
    try{
      if(!blob) return res(null);
      var fd = new FormData();
      fd.append("file", blob, nom || "fichier");
      fd.append("upload_preset", VD_CLOUD_PRESET);
      fetch(adresse || VD_CLOUD_IMG, { method: "POST", body: fd })
        .then(function(r){ return r.json(); })
        .then(function(j){ res((j && (j.secure_url || j.url)) || null); })
        .catch(function(){ res(null); });
    }catch(e){ res(null); }
  });
}
function vdPhotoChoisie(fichier){
  if(!fichier) return Promise.resolve(false);
  if(!CHAT.open || !CHAT.tid){ toast(LANG === "fr" ? "Ouvrez une conversation" : "Open a conversation"); return Promise.resolve(false); }
  if(!FB.user){ openSignIn(); return Promise.resolve(false); }
  var tid = CHAT.tid;
  toast(LANG === "fr" ? "📷 Envoi de la photo…" : "📷 Sending photo…");
  return vdReduirePhoto(fichier, 1280, 0.72).then(function(durl){
    if(!durl){ toast(LANG === "fr" ? "⚠️ Photo illisible" : "⚠️ Unreadable photo"); return false; }
    return vdTeleverser(vdVersBlob(durl), "photo.jpg", VD_CLOUD_IMG).then(function(url){
      if(!url){ toast(LANG === "fr" ? "⚠️ Envoi impossible" : "⚠️ Upload failed"); return false; }
      var key = null;
      try{ key = FB.db.ref("market_chats/" + tid + "/messages").push().key; }catch(e){ key = null; }
      if(key) preMarkThreadMsg(tid, key);
      var arr = threadMsgs(tid);
      arr.push({ who: "me", text: "", photos: [url], ts: Date.now(), key: key });
      renderThread();
      sendMarketMessage(tid, { imageUrl: url }, function(ok){
        if(!ok) toast(LANG === "fr" ? "⚠️ Message non parti" : "⚠️ Message not sent");
      }, key);
      return url;
    });
  });
}

var VD_VOIX = null;

function vdVocalDemarrer(){

/* --- 1. etre prevenu meme hors de l'onglet ------------------------ */
/* Le bandeau interne ne sert a rien si la personne regarde un autre
   onglet ou une autre application : elle ne voit RIEN. Une notification
   du navigateur, elle, s'affiche par-dessus tout. On ne la demande pas
   au chargement (refus quasi garanti) mais au premier message recu. */
function vdNotifPermission(){
  try{
    if(!("Notification" in window)) return "absent";
    return Notification.permission;
  }catch(e){ return "absent"; }
}
function vdNotifDemander(){
  try{
    if(!("Notification" in window)) return false;
    if(Notification.permission !== "default") return Notification.permission === "granted";
    Notification.requestPermission().then(function(){ }).catch(function(){});
    return true;
  }catch(e){ return false; }
}
var VD_NOTIFS = {};
function vdNotifMessage(tid, nom, texte){
  try{
    if(!("Notification" in window)) return false;
    if(Notification.permission !== "granted"){ vdNotifDemander(); return false; }
    if(document.visibilityState === "visible" && CHAT.open && CHAT.tid === tid) return false;
    /* une seule notification par conversation : sinon dix messages
       d'affilee en empilent dix. */
    var n = new Notification(nom || "Shalom Square", {
      body: String(texte || "").slice(0, 120),
      icon: "./icon-192.png",
      tag: "vd-" + tid,
      renotify: true
    });
    n.onclick = function(){
      try{ window.focus(); openThread(tid); n.close(); }catch(e){}
    };
    VD_NOTIFS[tid] = n;
    setTimeout(function(){ try{ n.close(); }catch(e){} }, 12000);
    return true;
  }catch(e){ return false; }
}

/* ═══════════════════════════════════════════════════════════════════
   (20261008i) SE CONNECTER AVEC GOOGLE, PARTOUT, Y COMPRIS AU TELEPHONE

   UN COMPTE GOOGLE N'A PAS DE MOT DE PASSE. Essayer de l'ouvrir avec
   une adresse et un mot de passe renvoie « auth/invalid-login-credentials »,
   un message qui laisse croire a une faute de frappe alors que le
   compte, lui, va tres bien. C'est ce qui s'est passe sur l'outil
   d'administration.

   SUR TELEPHONE, LA FENETRE SURGISSANTE NE MARCHE PRESQUE JAMAIS.
   Elle est bloquee par le navigateur, fermee par le systeme, ou
   simplement interdite dans une application installee. Jusqu'ici les
   deux applications n'essayaient QUE la fenetre surgissante : sur
   Android, le bouton Google ne faisait donc souvent rien du tout,
   sans le moindre message.

   Desormais : redirection directe sur telephone, fenetre sur
   ordinateur, et repli automatique sur la redirection si elle echoue.
   Au retour de la redirection, la connexion est reprise toute seule.
   ═══════════════════════════════════════════════════════════════════ */
function vdEstMobile(){
  try{ return /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|Mobile/i.test(navigator.userAgent); }
  catch(e){ return false; }
}
function vdGoogleProvider(){
  var p = new firebase.auth.GoogleAuthProvider();
  try{ p.setCustomParameters({ prompt: "select_account" }); }catch(e){}
  return p;
}
function vdErreurAuthLisible(e){
  var c = (e && e.code) || "";
  if(/invalid-login-credentials|user-not-found|wrong-password|invalid-credential/.test(c))
    return (LANG === "fr")
      ? "Ce compte n a pas de mot de passe, ou il est faux. S il a ete cree avec Google, utilisez le bouton Google."
      : "This account has no password, or it is wrong. If it was created with Google, use the Google button.";
  if(/popup-blocked|popup-closed|cancelled-popup/.test(c))
    return (LANG === "fr") ? "La fenetre Google a ete bloquee. On reessaie autrement." : "Google window blocked. Retrying.";
  if(/network-request-failed/.test(c))
    return (LANG === "fr") ? "Pas de reseau. Reessayez." : "No network. Try again.";
  return (e && e.message) || "Erreur";
}
function vdConnexionGoogle(afficherErreur){
  try{
    if(!FB.ready){ if(afficherErreur) afficherErreur("Firebase indisponible"); return false; }
    var prov = vdGoogleProvider();
    var parRedirection = function(){
      try{ FB.auth.signInWithRedirect(prov); }
      catch(e){ if(afficherErreur) afficherErreur(vdErreurAuthLisible(e)); }
    };
    if(vdEstMobile()){ parRedirection(); return true; }
    FB.auth.signInWithPopup(prov).then(function(){
      try{ closeModal(); }catch(e){}
    }).catch(function(e){
      var c = (e && e.code) || "";
      if(/popup-blocked|popup-closed|cancelled-popup|operation-not-supported|web-storage/.test(c)) return parRedirection();
      if(afficherErreur) afficherErreur(vdErreurAuthLisible(e));
    });
    return true;
  }catch(e){ return false; }
}
/* Au retour de la redirection, la page est rechargee : sans cette
   reprise, la personne reviendrait sur l ecran de connexion sans
   comprendre pourquoi rien ne s est passe. */
function vdReprendreGoogle(){
  try{
    if(!FB.ready || vdReprendreGoogle._fait) return false;
    vdReprendreGoogle._fait = true;
    FB.auth.getRedirectResult().then(function(r){
      if(r && r.user){
        try{ closeModal(); }catch(e){}
        try{ toast((LANG === "fr" ? "Bienvenue " : "Welcome ") + (r.user.displayName || "")); }catch(e){}
      }
    }).catch(function(e){
      try{ toast(vdErreurAuthLisible(e)); }catch(x){}
    });
    return true;
  }catch(e){ return false; }
}
function vdVeilleGoogle(){
  try{
    if(window.__vdGoogle) return false;
    window.__vdGoogle = setInterval(function(){ try{ vdReprendreGoogle(); }catch(e){} }, 2000);
    return true;
  }catch(e){ return false; }
}

    var n=0;

/* 25. SEPARATEURS DE JOUR — « Aujourd'hui / Hier / 3 oct. » : sans
   eux, on ne sait plus si un message date d'une heure ou d'un mois. */
function vdSeparateurJour(ts, tsPrecedent){
  try{
    var d=new Date(Number(ts)||0); if(!ts) return "";
    var jour=function(x){ return new Date(x).toDateString(); };
    if(tsPrecedent && jour(tsPrecedent)===jour(ts)) return "";
    var auj=new Date(), hier=new Date(Date.now()-86400000);
    if(jour(ts)===auj.toDateString()) return "Aujourd'hui";
    if(jour(ts)===hier.toDateString()) return "Hier";
    return d.toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:(d.getFullYear()!==auj.getFullYear())?"numeric":undefined});
  }catch(e){ return ""; }
}
