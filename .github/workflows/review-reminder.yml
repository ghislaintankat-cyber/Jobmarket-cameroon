name: Remind Users to Leave a Review

on:
  schedule:
    # Une fois par jour suffit : la fenêtre d'éligibilité va de 3h à 5 jours
    # après le contact, et chaque contact n'est rappelé qu'UNE SEULE fois
    # par push (voir job_contacts/{id}/reviewReminderSent).
    - cron: "0 12 * * *"
  workflow_dispatch: # déclenchement manuel possible, utile pour tester

concurrency:
  group: remind-reviews
  cancel-in-progress: false

jobs:
  remind-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run review reminder script
        run: node scripts/sendReviewReminders.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
