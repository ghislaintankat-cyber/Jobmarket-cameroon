name: Notify User of New Review

on:
  schedule:
    # Filet de sécurité seulement : le déclenchement principal est instantané
    # via le Cloudflare Worker (repository_dispatch, voir plus bas). Un avis
    # est encore moins urgent qu'un contact, d'où un intervalle large.
    - cron: "*/30 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [new-review] # déclenché instantanément depuis index.html via worker/index.js

concurrency:
  group: notify-reviews
  cancel-in-progress: false

jobs:
  notify-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run review notification script
        run: node scripts/sendReviewNotifications.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
