name: Notify Users of Messages

on:
  schedule:
    # Filet de sécurité (comme notify.yml) : le déclencheur PRINCIPAL est le
    # relais Cloudflare Worker jobmarket-notify-trigger via repository_dispatch
    # (event_type "new-message"). Ce cron ne sert que si le relais est en
    # panne ou si un message est passé pendant une coupure réseau.
    - cron: "*/15 * * * *"
  workflow_dispatch: # déclenchement manuel possible
  repository_dispatch:
    # new-message : nouveau message in-app. (new-quote est conservé par
    # compatibilité au cas où un ancien appel traînerait, mais le devis a
    # été retiré de l'app.)
    types: [new-message, new-quote]

concurrency:
  group: notify-messages
  cancel-in-progress: false # on met en file d'attente plutôt que d'annuler un envoi en cours

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run message notification script
        run: node scripts/sendQuoteMessageNotifications.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
