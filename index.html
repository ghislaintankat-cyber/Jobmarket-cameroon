<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JobMarket Cameroon</title>

<!-- Redirection SANS JavaScript (filet de sécurité si le script est bloqué).
     Le script ci-dessous prend la main avant, et lui conserve les paramètres
     de l'adresse (?id=... des profils partagés). -->
<meta http-equiv="refresh" content="1;url=https://ghislaintankat-cyber.github.io/Jobmarket-cameroon/">
<link rel="canonical" href="https://ghislaintankat-cyber.github.io/Jobmarket-cameroon/">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#0A0A0F">

<style>
  html,body{margin:0;height:100%;background:#0A0A0F;color:#F0F0F8;
            font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .c{height:100%;display:flex;flex-direction:column;align-items:center;
     justify-content:center;gap:16px;text-align:center;padding:24px}
  .logo{width:96px;height:96px;border:3px solid #FFD700;border-radius:22px;
        display:flex;align-items:center;justify-content:center;
        font-size:38px;font-weight:800;color:#FFD700;letter-spacing:1px}
  h1{margin:0;font-size:20px;color:#FFD700}
  p{margin:0;font-size:14px;color:#9999BC}
  a{display:inline-block;margin-top:10px;background:#25D366;color:#062814;
    text-decoration:none;font-weight:800;padding:13px 26px;border-radius:26px}
</style>
</head>
<body>
  <div class="c">
    <div class="logo">JM</div>
    <h1>JobMarket Cameroon</h1>
    <p>Redirection en cours…</p>
    <a id="go" href="https://ghislaintankat-cyber.github.io/Jobmarket-cameroon/">Continuer</a>
  </div>

<script>
// Redirection immédiate EN CONSERVANT le chemin et les paramètres.
// Indispensable : l'application partage des profils avec « ?id=... » et des
// annonces avec « #... ». Une redirection brutale vers la racine ferait
// perdre ces informations — la personne arriverait sur l'accueil au lieu de
// l'annonce qu'on lui a envoyée.
(function () {
  var base = "https://ghislaintankat-cyber.github.io/Jobmarket-cameroon/";
  try {
    var suite = (location.pathname || "/").replace(/^\/[^/]*\/?/, "");
    var cible = base + suite + (location.search || "") + (location.hash || "");
    var a = document.getElementById("go");
    if (a) a.href = cible;
    location.replace(cible);
  } catch (e) {
    location.replace(base);
  }
})();
</script>
</body>
</html>
